[mcp_servers.wasurezu]
command = "node"
args = ["/Users/yuji/Developer/agent-memory/dist/index.js"]
env = { DATABASE_URL = "postgresql:///agent_comms?host=/tmp", AGENT_MEMORY_AGENT_ID = "agent-com-dev", AGENT_MEMORY_PROJECT = "agent-comms-mcp", AGENT_MEMORY_HOST = "codex", AGENT_MEMORY_CAPTURE_MODE = "raw", AGENT_MEMORY_TAG_CAPTURE = "0", AGENT_MEMORY_BOOT_CATCH_UP = "0", AGENT_MEMORY_INDEXER_MODE = "rules", AGENT_MEMORY_AI_EXTRACTOR = "off", AGENT_MEMORY_REDACTION_MODE = "basic" }
startup_timeout_sec = 60
tool_timeout_sec = 120

[mcp_servers.wasurezu.tools.recover_context]
approval_mode = "approve"

[mcp_servers.wasurezu.tools.search_memory]
approval_mode = "approve"
