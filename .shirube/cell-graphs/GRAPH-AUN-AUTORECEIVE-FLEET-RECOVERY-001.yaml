goal:
  id: GOAL-AUN-AUTORECEIVE-FLEET-RECOVERY-001
  statement: >-
    From one exact owner-pinned agent-comms release, the canonical aun seat and
    every target in the trusted production manifest automatically receive and
    complete ordinary AUN work after daemon start or restart without manual
    next or inbox, operator bypass, raw SQL queue edits, unmanaged retries, or
    protected D1 authority bleed; exact MCP bootstrap, queue reconciliation,
    endpoint ownership, manifest schema, all-agent direct delivery, and a
    controlled login or reboot convergence test are proven with durable evidence.
  terminal_state: VERIFIED_DONE
  not_done_if:
    - code merged, build green, or daemon process healthy only
    - one exact-fenced canary or canonical aun direct projection succeeded only
    - Discord visibility exists without queue, result, reply, and terminal evidence
    - any production target is excluded without an owner-bounded exclusion
    - manifest count, schema, revision, or digest is unresolved
    - any NORM-060 blocking failure class is nonzero
    - any related control source remains open without immutable requirement-level successor disposition
    - any PASS depends on manual next, inbox, queue drain, prompt injection, raw SQL, manual terminalization, or explicit operator bypass
definitions:
  automatic_receive_recovered:
    required:
      - ordinary post-activation queue detected by notification or bounded sweep
      - automatic claim uses lease fence and correct runtime identity
      - runner emits a schema-valid typed result
      - finalizer emits reply or outbound projection evidence
      - source queue reaches exactly one valid terminal state
      - correlated audit evidence exists
      - two fresh ordinary queues pass after removal of the one-row fence
      - one approved daemon restart preserves convergence
    prohibited_pass_contributions:
      - manual next or inbox
      - FIFO drain
      - prompt injection
      - explicit_operator_bypass
      - raw SQL mutation
      - manual terminalization
  production_denominator:
    rule: >-
      Derive only from canonical profile policy and explicit classification
      evidence. Agent-name inference, raw registry counts, and test fixtures are
      forbidden as production authority.
    completion: expected_target_count equals resolved_target_count equals N with zero ambiguity.
  distribution:
    definition: >-
      Desired-state publication plus manifest admission plus exact MCP bootstrap,
      daemon scope, runtime, endpoint, profile, provider, and live per-target
      equality; file copying or a tmux session alone is not distribution.
architecture_boundaries:
  aun_core: >-
    Owns desired state, logical identity, queue readiness, wake policy, claim,
    lease, fence, typed outcome, terminal evidence, and GO or NO-GO policy.
  runtime_supervisor_adapter: >-
    Owns host-specific inspect, readiness, wake, start, stop, restart, logs, and
    attach. tmux and launchd are adapters and may not become core identity or
    lifecycle authority.
  runtime_adapter: >-
    Owns Codex, Claude Code, OpenClaw, or other invocation and typed result
    parsing only after an exact queue row is admitted.
  connector_projection_adapter: >-
    Owns Discord or other provider delivery and read or write evidence. A
    projection is not identity, ownership, or completion authority.
  repository_or_persistence_adapter: >-
    Owns SQLite and PostgreSQL persistence mechanics behind one contract; live
    schema activation is separately owner-gated and protected.
  manifest_policy: >-
    Owns closed-world target identity, canonical bytes and digests, revision,
    expiry, revocation, owner pin, drift detection, and explicit D1 isolation.
  mcp_surface: >-
    Exposes the control-plane contract and exact runtime registration. It does
    not directly own OS process lifecycle across deployment platforms.
  deterministic_skeleton: >-
    Eligibility, identity, claim, lease, fence, reconciliation, admission,
    lifecycle transitions, finalization, rollback, and protected gates are
    script-controlled. LLM output never owns admission or terminal authority.
  learning_loop: >-
    Every escaped failure becomes a versioned fixture, stable blocker code, or
    conformance test before the next rollout wave.
