failure_modes:
  - {id: FM-PLACED-NOT-DELIVERED, detection: artifact exists without API equality and AUN reach receipt, recovery: keep Cell nonterminal and re-deliver exact refs}
  - {id: FM-DECLARED-NOT-VERIFIED, detection: profile status port session or label substitutes for current identity evidence, recovery: fail readiness and require fresh runtime-bound attestation}
  - {id: FM-RAW-DENOMINATOR-AS-AUTHORITY, detection: raw count 39 or legacy candidate count is frozen as production N, recovery: reject and reconcile canonical classification without name inference}
  - {id: FM-RETIRED-SEAT-FENCE, detection: daemon allowlist or queue fence targets codex-aun or a terminal row, recovery: keep activation blocked and produce an exact canonical transition plan under OD-AUN-001}
  - {id: FM-DUPLICATE-RUNTIME, detection: one target resolves to zero or multiple fresh runtimes, recovery: deny target admission and reconcile ownership and freshness}
  - {id: FM-PROFILE-STATE-CONTRADICTION, detection: profile_enabled true conflicts with disabled_at or lifecycle status, recovery: fail closed with explicit owner-bounded reconciliation}
  - {id: FM-WRONG-ENDPOINT-IDENTITY, detection: listener session process or endpoint belongs to another agent or release, recovery: stop before claim and route bounded repair under protected approval}
  - {id: FM-CLAIM-LEASE-RACE, detection: stale or duplicate claim result or terminal mutation, recovery: enforce mutation-time fence affected-row one and preserve retry evidence}
  - {id: FM-FINALIZER-FALSE-SUCCESS, detection: runner provider or finalizer failure is reported as terminal success, recovery: reject terminalization and emit typed failure with bounded retry}
  - {id: FM-RESTART-DUPLICATE, detection: pre-restart or terminal work executes again, recovery: trip kill switch rollback and preserve exact claim and fence evidence}
  - {id: FM-PARTIAL-FLEET-ACTIVATION, detection: a wave continues after first failed target, recovery: stop later admission and restore previous manifest release and config}
  - {id: FM-D1-AUTHORITY-BLEED, detection: ordinary manifest alters D1 allowlist receipts admission or effects, recovery: fail regression and rollback ordinary activation only}
  - {id: FM-HUMAN-BYPASS-AS-PASS, detection: next inbox drain prompt raw SQL manual close or bypass contributes to success, recovery: invalidate PASS and repeat with contribution count zero}
  - {id: FM-ROLLBACK-UNVERIFIED, detection: rollback command exists without restore readback, recovery: keep protected rollout blocked and rehearse exact previous state}
