failure_modes:
  - {id: FM-PLACED-NOT-DELIVERED, detection: artifact exists without API equality and AUN reach receipt, recovery: keep Cell nonterminal and redeliver exact refs}
  - {id: FM-DECLARED-NOT-VERIFIED, detection: profile status port session or label substitutes for current identity evidence, recovery: fail readiness and require fresh runtime-bound attestation}
  - {id: FM-RAW-DENOMINATOR-AS-AUTHORITY, detection: raw count or test fixture is frozen as production N, recovery: reject and reconcile canonical classification without name inference}
  - {id: FM-RETIRED-SEAT-FENCE, detection: daemon allowlist or queue fence targets retired codex-aun or terminal row, recovery: keep activation blocked and produce exact canonical plan under OD-AUN-001}
  - {id: FM-DUPLICATE-RUNTIME, detection: target resolves to zero or multiple fresh runtimes, recovery: deny admission and reconcile ownership and freshness}
  - {id: FM-PROFILE-STATE-CONTRADICTION, detection: profile_enabled conflicts with disabled_at or lifecycle status, recovery: fail closed with owner-bounded reconciliation}
  - {id: FM-WRONG-ENDPOINT-IDENTITY, detection: listener session process or endpoint belongs to another agent or release, recovery: stop before claim and route bounded repair under protected approval}
  - {id: FM-CLAIM-LEASE-RACE, detection: stale or duplicate claim result or terminal mutation, recovery: enforce mutation-time fence affected-row one and preserve retry evidence}
  - {id: FM-FINALIZER-FALSE-SUCCESS, detection: runner provider or finalizer failure is terminal success, recovery: reject terminalization and emit typed failure with bounded retry}
  - {id: FM-RESTART-DUPLICATE, detection: pre-restart or terminal work executes again, recovery: trip kill switch rollback and preserve claim and fence evidence}
  - {id: FM-PARTIAL-FLEET-ACTIVATION, detection: wave continues after first failed target, recovery: stop later admission and restore previous manifest release and config}
  - {id: FM-D1-AUTHORITY-BLEED, detection: ordinary manifest alters D1 allowlist receipts admission history or effects, recovery: fail regression and rollback ordinary activation only}
  - {id: FM-HUMAN-BYPASS-AS-PASS, detection: next inbox drain prompt raw SQL manual close or bypass contributes to success, recovery: invalidate PASS and repeat with zero contribution}
  - {id: FM-ROLLBACK-UNVERIFIED, detection: rollback command exists without restore readback, recovery: keep rollout blocked and rehearse exact previous state}
  - {id: FM-HOST-SUPERVISOR-LEAK, detection: core owns tmux launchd or host command authority, recovery: reject and move mechanics behind conformance-tested supervisor adapter}
  - {id: FM-MANIFEST-SCHEMA-MISSING, detection: live manifest tables or exact revision shape absent, recovery: block publication and execute only approved exact migration with negative proof}
  - {id: FM-RELATED-CONTROL-UNRESOLVED, detection: issue 691 603 604 449 or 435 remains open without complete successor mapping, recovery: keep VERIFIED_DONE blocked and record immutable requirement disposition}
  - {id: FM-MCP-REGISTRATION-DRIFT, detection: fresh Codex or Claude loads stale dirty or wrong-identity MCP registration, recovery: stop tool smoke restore exact approved registration and prove restart persistence}
  - {id: FM-UNSAFE-QUEUE-RECONCILIATION, detection: row is terminalized by age free-form prose unbounded drain or planless mutation, recovery: halt apply preserve evidence and require deterministic reviewed plan hash}
  - {id: FM-SILENT-DELIVERY-FALLBACK, detection: intended direct sender lacks lease or ownership and AUN relay masks failure, recovery: fail NORM-060 block activation and reconcile runtime endpoint and delivery owner}
