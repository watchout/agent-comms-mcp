    verification_boundary: Every target passes the identical live lifecycle; N of N verified; blockers, drift, bypass, and unexpected exclusions zero.
    completes_when: All approved waves pass, rollback evidence remains usable, and independent audit confirms full target equality.
    lifecycle_state: blocked_on_cell_40_and_owner_decision
