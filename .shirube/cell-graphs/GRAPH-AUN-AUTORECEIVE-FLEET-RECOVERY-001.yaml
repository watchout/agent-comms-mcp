goal:
  id: GOAL-AUN-AUTORECEIVE-FLEET-RECOVERY-001
  statement: >-
    From one exact owner-pinned agent-comms release, the canonical aun seat and
    every target in the trusted production manifest automatically receive and
    complete ordinary AUN work after daemon start or restart without manual
    next or inbox, operator bypass, raw SQL queue edits, unmanaged retries, or
    protected D1 authority bleed; a controlled login or reboot convergence test
    proves recovery and rollback.
  terminal_state: VERIFIED_DONE
  not_done_if:
    - code merged or daemon process healthy only
    - one exact-fenced canary succeeded only
    - Discord visibility exists without queue, result, reply, and terminal evidence
    - any production target is excluded without an owner-bounded exclusion
    - manifest count or digest is unresolved
    - any PASS depends on manual next, inbox, queue drain, prompt injection, raw SQL, manual terminalization, or explicit operator bypass
definitions:
  state_daemon_new_release:
    required:
      - exact commit and tree
      - immutable checkout and build provenance
      - Bun executable independent of LaunchAgent PATH
      - LaunchAgent plist and environment digest plus restore commit
      - canonical manifest id, revision, artifact digest, and target digest
      - rollback release, rollback config, and kill switch
  automatic_receive_recovered:
    required:
      - ordinary post-activation queue detected by notification or bounded sweep
      - automatic claim uses lease, fence, and correct runtime identity
      - runner emits a schema-valid typed result
      - finalizer emits reply or outbound projection evidence
      - source queue reaches exactly one valid terminal state
      - correlated audit evidence exists
      - two fresh ordinary queues pass after removal of the one-row fence
      - one approved daemon restart preserves convergence
    prohibited_pass_contributions:
      - manual next or inbox
      - FIFO drain
      - prompt injection
      - explicit_operator_bypass
      - raw SQL mutation
      - manual terminalization
  all_agent_recovered:
    denominator_rule: >-
      The production denominator is derived only from canonical profile policy
      and explicit classification evidence; agent-name inference is forbidden.
    required:
      - trusted closed-world manifest has exact target_count N and stable target_sha256
      - resolved_target_count equals expected_target_count
      - every target has exactly one primary workspace and exactly one fresh selected runtime
      - every target has explicit active_function, control_source, auto_receive, protected_d1, and Discord mode
      - every target passes the same queue lifecycle
      - blockers, drift, unexpected exclusions, and bypass count are all zero
      - protected D1 admission remains independently fail-closed
  distribution:
    definition: >-
      Desired-state publication plus manifest admission plus daemon scope plus
      runtime and profile equality plus live per-target proof; file copying is
      not distribution.
architecture_boundaries:
  aun_core: >-
    Owns desired state, logical agent identity, queue readiness, wake policy,
    claim, lease, fence, typed outcome, terminal evidence, and GO or NO-GO policy.
  runtime_supervisor_adapter: >-
    Owns host-specific inspect, readiness, wake, start, stop, restart, logs, and
    attach implementations. tmux and launchd are local adapters, not architecture.
  runtime_adapter: >-
    Owns Codex, Claude Code, OpenClaw, or other invocation and typed result
    parsing only after an exact queue row is admitted.
  connector_projection_adapter: >-
    Owns Discord or other provider delivery and read or write evidence. A
    projection is not identity, ownership, or completion authority.
  manifest_policy: >-
    Owns closed-world target identity, canonical bytes and digests, revision,
    expiry, revocation, owner pin, drift detection, and explicit D1 isolation.
  mcp_surface: >-
    Exposes or consumes the control-plane contract. It does not directly own OS
    process lifecycle across all deployment platforms.
  adapter_variation_axes:
    ui: connector_projection_adapter
    llm: runtime_adapter
    database: repository_or_persistence_adapter
    authentication: identity_and_provider_attestation_adapter
    platform: runtime_supervisor_adapter
  deterministic_skeleton: >-
    Eligibility, identity, claim, lease, fence, manifest admission, lifecycle
    transitions, finalization, rollback, and protected gates are script-controlled.
    LLM output may supply task content but never admission or terminal authority.
  learning_loop: >-
    Every escaped failure becomes a versioned fixture, stable blocker code, or
    conformance test before the next rollout wave; production inference by an
    LLM is forbidden.
