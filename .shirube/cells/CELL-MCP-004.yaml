schema_version: shirube-cell/v1
CELL-ID: CELL-MCP-004
SPEC-ID: SPEC-MCP-GOV-001
risk_tier: R2
goal: Draft output schema validation expectations for planners, diagnostics, evidence, and conveyor-facing results.
covered_req_ids:
  - REQ-MCP-GOV-003
  - AI-MCP-GOV-001
dependencies:
  - CELL-MCP-GOV-001
allowed_paths:
  - .shirube/**
  - docs/**
  - README.md
forbidden_paths:
  - .env
  - secrets/**
  - bin/**
  - cli/**
  - core/**
  - server.ts
  - .github/workflows/**
acceptance_criteria:
  - id: AC-MCP-004-001
    statement: Future versioned output schemas are identified for planner, diagnostic, conveyor, and evidence outputs.
    linked_req_ids:
      - REQ-MCP-GOV-003
  - id: AC-MCP-004-002
    statement: Failure behavior expectations are documented without changing CLI or MCP output behavior.
    linked_req_ids:
      - AI-MCP-GOV-001
required_tests:
  - TEST-MCP-GOV-001
  - TEST-MCP-GOV-002
required_evidence:
  - changed files
  - yaml parse results
  - scope confirmation
  - Shirube command review result
non_goals:
  - No new runtime schema validator.
  - No CLI output behavior change.
  - No required check activation.
stop_conditions:
  - Implementation would touch forbidden_paths.
  - Output behavior would change.
  - New validation dependencies or enforcement would be added.
waiver_refs: []
execution_contract:
  canonical_term: Goal-directed bounded execution
  shorthand: Goal-mode Implementation
  allowed_commands:
    - git diff --check
    - YAML parse for .shirube/**/*.yaml
    - existing lightweight smoke checks
  forbidden_commands:
    - git push --force
    - destructive production commands
    - active workflow or branch protection mutation
  handoff_conditions:
    - Shirube command review
    - repository owner/domain designer confirmation
  completion_evidence:
    - changed files
    - commands run
    - validation results
    - next required gate
