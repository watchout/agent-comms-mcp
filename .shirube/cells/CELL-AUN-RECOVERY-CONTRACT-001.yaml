risk_tier: R2
goal: >-
  Freeze the complete automatic-receive fleet recovery goal, definitions,
  denominator policy, graph, requirements, acceptance criteria, completion
  checklist, test trace, failure and rollback rules, evidence sinks, protected
  decisions, and frontmost handoff before protected execution begins.
primary_responsibility: Control contract and independently auditable planning freeze only.
implementation_boundary:
  allowed_paths:
    - .shirube/cell-graphs/GRAPH-AUN-AUTORECEIVE-FLEET-RECOVERY-001.yaml
    - .shirube/cells/CELL-AUN-RECOVERY-CONTRACT-001.yaml
    - .shirube/specs/SPEC-AUN-AUTORECEIVE-FLEET-RECOVERY-001.md
    - .shirube/control-handoffs/CH-AUN-RECOVERY-CONTRACT-001.yaml
    - .shirube/audit-checklists/AUDIT-CHECKLIST-CELL-AUN-RECOVERY-CONTRACT-001.yaml
  allowed_external_effects:
    - Publish one immutable Issue 602 V3 amendment.
    - Push one docs and Control-only branch.
    - Open one Draft Control artifact PR.
    - Route one independent exact-head evidence audit.
  forbidden:
    - product or runtime code edits
    - DB or queue mutation
    - state_daemon or LaunchAgent mutation
    - manifest publication or activation
    - Discord live write or queue canary
    - runtime start, stop, restart, wake, or prompt injection
    - PR Ready transition, approval, merge, deploy, rollout, or release
    - self-audit or self-acceptance
verification_boundary:
  - Exact base commit and tree match the pinned baseline.
  - All five YAML or Markdown artifacts exist in the exact path set.
  - Every YAML file parses with aliases disabled.
  - Graph contains exactly six ordered Cells, 14 requirements, 14 acceptance criteria, 18 tests, and 15 completion predicates.
  - Every requirement maps to at least one acceptance criterion and one test.
  - Every test references only declared requirements.
  - The raw count 39 is observed evidence and never the authoritative production denominator.
  - G1 through G7 are present and PASS in the candidate.
  - Issue amendment body equals the GitHub API readback bytes.
  - Independent auditor is not ARC or the implementation requester.
completes_parent_goal: false
completion_rule: >-
  Cell 10 completes only after the immutable Issue amendment, Draft Control PR,
  exact artifact hashes, machine-validation evidence, AUN delivery receipt, and
  an independent exact-head audit PASS are all present. Merge alone is not Cell
  completion and no runtime effect is authorized by Cell 10.
lifecycle_state: control_artifact_candidate_published_awaiting_independent_audit
gate_result:
  current: PASS_AS_CONTROL_CANDIDATE
  cell_complete: false
  next_cell_admitted: false
  protected_effect_count: 0
stop_conditions:
  - The base commit or tree differs from the pinned release baseline.
  - Any sixth repository path changes.
  - Runtime, DB, queue, LaunchAgent, manifest, provider, credential, or production state would change.
  - Raw registry count 39 or legacy activation candidate count is treated as production authority.
  - A requirement lacks acceptance or test trace.
  - Protected decisions OD-AUN-001 or OD-AUN-002 are bypassed or weakened.
  - Ordinary communication changes expand protected D1 admission or effects.
  - An author or implementation requester attempts to provide independent audit evidence.
next_action:
  blocking: true
  actor: codex-audit
  active_function: evidence_audit_gate
  action: Independently audit the Draft Control PR exact head and all five artifacts; do not implement fixes.
  delivery: GitHub exact-head verdict plus AUN delivery to ARC and AUN.
  input_refs:
    - https://github.com/watchout/agent-comms-mcp/issues/602
    - .shirube/cell-graphs/GRAPH-AUN-AUTORECEIVE-FLEET-RECOVERY-001.yaml
    - .shirube/control-handoffs/CH-AUN-RECOVERY-CONTRACT-001.yaml
    - .shirube/audit-checklists/AUDIT-CHECKLIST-CELL-AUN-RECOVERY-CONTRACT-001.yaml
  scope:
    allowed: Exact-head evidence audit and reproducible read-only validation.
    forbidden: Edits, runtime or protected effects, PR state changes, approval, merge, activation, or self-repair.
  deliverable: Exact-head PASS, REQUEST_CHANGES, or ESCALATE with gate-specific findings.
  completion_evidence: Immutable verdict URL, head and tree, artifact hashes, validation commands and outputs, and AUN receipt.
