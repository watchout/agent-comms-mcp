schema_version: shirube-cell/v1
status: draft_candidate
cell_id: CELL-MCP-001
title: Registry schema
risk_tier: R2
repo_id: watchout/agent-comms-mcp
objective: Draft a registry schema for MCP tools, agent identities, runtime surfaces, and evidence anchors.
scope:
  allowed_paths:
    - .shirube/**
    - docs/**
    - README.md
  forbidden_paths:
    - bin/**
    - core/**
    - cli/**
    - server.ts
    - .github/workflows/**
non_goals:
  - No runtime registry implementation.
  - No active validation enforcement.
  - No migration or DB schema change.
acceptance_criteria:
  - Registry entities and ownership boundaries are documented.
  - Required evidence fields are identified.
  - Enforcement remains warn-only.
required_gates:
  - Shirube command review
  - repository owner/domain designer confirmation
