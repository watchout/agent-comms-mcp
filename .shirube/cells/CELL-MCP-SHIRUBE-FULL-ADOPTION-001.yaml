schema_version: shirube-cell/v1
CELL-ID: CELL-MCP-SHIRUBE-FULL-ADOPTION-001
SPEC-ID: SPEC-MCP-SHIRUBE-FULL-ADOPTION-001
risk_tier: R3
goal: Complete repository-local Shirube full adoption overlay for agent-comms-mcp.
covered_req_ids:
  - REQ-MCP-SHIRUBE-FULL-001
  - REQ-MCP-SHIRUBE-FULL-002
  - REQ-MCP-SHIRUBE-FULL-003
  - REQ-MCP-SHIRUBE-FULL-004
  - REQ-MCP-SHIRUBE-FULL-005
  - REQ-MCP-SHIRUBE-FULL-006
  - REQ-MCP-SHIRUBE-FULL-007
  - REQ-MCP-SHIRUBE-FULL-008
dependencies:
  - SPEC-MCP-AUN-V2V3-FOUNDATION-001
allowed_paths:
  - .shirube/**
  - .github/workflows/pr-checks.yml
  - .github/pull_request_template.md
  - scripts/shirube-full-adoption-check.mjs
  - docs/**
  - README.md
forbidden_paths:
  - .env
  - .env.*
  - secrets/**
  - server.ts
  - core/**
  - cli/**
  - bin/**
  - entrypoints/**
  - adapters/**
  - db/**
  - hooks/**
  - package.json
  - bun.lockb
  - package-lock.json
  - pnpm-lock.yaml
  - deploy/**
acceptance_criteria:
  - id: AC-MCP-SHIRUBE-FULL-001
    statement: Workflow gate verifies primary target repo and support repo classifications.
    linked_req_ids:
      - REQ-MCP-SHIRUBE-FULL-001
      - REQ-MCP-SHIRUBE-FULL-003
  - id: AC-MCP-SHIRUBE-FULL-002
    statement: Auto-merge no longer runs on CI green alone and Layer 0 requires owner exact-head labels plus a machine-verified owner decision artifact before non-draft handling.
    linked_req_ids:
      - REQ-MCP-SHIRUBE-FULL-002
      - REQ-MCP-SHIRUBE-FULL-004
      - REQ-MCP-SHIRUBE-FULL-007
  - id: AC-MCP-SHIRUBE-FULL-003
    statement: Pull request template includes Shirube metadata, scope, protected surfaces, validation, owner decision, and post-merge evidence sections.
    linked_req_ids:
      - REQ-MCP-SHIRUBE-FULL-005
  - id: AC-MCP-SHIRUBE-FULL-004
    statement: Branch protection requires Layer 0 machine gate and Layer 0 includes the Shirube full-adoption gate.
    linked_req_ids:
      - REQ-MCP-SHIRUBE-FULL-006
  - id: AC-MCP-SHIRUBE-FULL-005
    statement: Required Layer 0 reruns on PR ready/draft, label, and edit transitions that affect owner authorization.
    linked_req_ids:
      - REQ-MCP-SHIRUBE-FULL-008
required_tests:
  - TEST-MCP-SHIRUBE-FULL-001
  - TEST-MCP-SHIRUBE-FULL-002
  - TEST-MCP-SHIRUBE-FULL-003
  - TEST-MCP-SHIRUBE-FULL-004
  - TEST-MCP-SHIRUBE-FULL-005
required_evidence:
  - changed files
  - context reset result
  - git diff --check result
  - YAML parse result
  - shirube full-adoption gate result
  - non-draft owner decision artifact rejection/acceptance result
  - detect-breaking-changes result
  - remote PR checks result
  - branch protection required status checks result
  - pull_request activity type coverage result
non_goals:
  - No AUN runtime implementation.
  - No MCP/tool behavior change.
  - No queue, state-daemon, provider, DB, secret, or deployment change.
  - No ruleset mutation when branch protection required checks provide the active merge gate.
stop_conditions:
  - Actual git repository is not watchout/agent-comms-mcp.
  - A runtime/product protected file must change.
  - Ruleset mutation is attempted without a separate owner/security/CTO approval.
  - PR is marked ready or merge-ready without owner exact-head authorization.
waiver_refs: []
execution_contract:
  canonical_term: Shirube full adoption overlay
  allowed_commands:
    - git diff --check
    - YAML parse for .shirube/**/*.yaml
    - node scripts/shirube-full-adoption-check.mjs
    - gh api repos/watchout/agent-comms-mcp/branches/main/protection/required_status_checks
    - bash scripts/detect-breaking-changes.sh origin/main
    - bun test --timeout 30000
    - gh pr edit for PR body metadata
    - git push to existing PR branch
  forbidden_commands:
    - git push --force
    - destructive production commands
    - AUN activation
    - production deploy
    - secret access
  completion_evidence:
    - pushed head SHA
    - local validation results
    - remote validation results
    - branch protection/ruleset API result
