schema_version: shirube-cell/v1
CELL-ID: CELL-MCP-002
SPEC-ID: SPEC-MCP-GOV-001
risk_tier: R2
goal: Draft the allowlist and denylist policy model for MCP/tool classes.
covered_req_ids:
  - REQ-MCP-GOV-002
  - SEC-MCP-GOV-001
dependencies:
  - CELL-MCP-GOV-001
allowed_paths:
  - .shirube/**
  - docs/**
  - README.md
forbidden_paths:
  - .env
  - secrets/**
  - bin/**
  - cli/**
  - core/**
  - server.ts
  - .github/workflows/**
acceptance_criteria:
  - id: AC-MCP-002-001
    statement: Tool classes are grouped by allowed, approval-required, and forbidden categories.
    linked_req_ids:
      - REQ-MCP-GOV-002
  - id: AC-MCP-002-002
    statement: R3 approval requirements are documented for high-risk tool classes under the v1 R0-R3 model.
    linked_req_ids:
      - SEC-MCP-GOV-001
required_tests:
  - TEST-MCP-GOV-001
  - TEST-MCP-GOV-002
required_evidence:
  - changed files
  - yaml parse results
  - scope confirmation
  - Shirube command review result
non_goals:
  - No runtime allowlist enforcement.
  - No tool registration changes.
  - No GitHub required check activation.
stop_conditions:
  - Implementation would touch forbidden_paths.
  - MCP/tool behavior would change.
  - Required owner/security/CTO approval is missing for R3 behavior-changing work.
waiver_refs: []
execution_contract:
  canonical_term: Goal-directed bounded execution
  shorthand: Goal-mode Implementation
  allowed_commands:
    - git diff --check
    - YAML parse for .shirube/**/*.yaml
    - existing lightweight smoke checks
  forbidden_commands:
    - git push --force
    - destructive production commands
    - active workflow or branch protection mutation
  handoff_conditions:
    - Shirube command review
    - repository owner/domain designer confirmation
  completion_evidence:
    - changed files
    - commands run
    - validation results
    - next required gate
