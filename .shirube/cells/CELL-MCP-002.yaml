schema_version: shirube-cell/v1
status: draft_candidate
cell_id: CELL-MCP-002
title: Allowlist and denylist policy
risk_tier: R2
repo_id: watchout/agent-comms-mcp
objective: Draft the policy model for allowed, review-required, and forbidden MCP/tool classes.
scope:
  allowed_paths:
    - .shirube/**
    - docs/**
    - README.md
  forbidden_paths:
    - bin/**
    - core/**
    - cli/**
    - server.ts
    - .github/workflows/**
non_goals:
  - No runtime allowlist enforcement.
  - No tool registration changes.
  - No GitHub required check activation.
acceptance_criteria:
  - Tool classes are grouped by risk and approval requirement.
  - Waiver requirements are documented.
  - Enforcement remains warn-only.
required_gates:
  - Shirube command review
  - repository owner/domain designer confirmation
