schema_version: shirube-cell/v1
CELL-ID: CELL-MCP-005
SPEC-ID: SPEC-MCP-GOV-001
risk_tier: R2
goal: Draft resource boundary policy for database, queue, runtime, provider, filesystem, and GitHub access.
covered_req_ids:
  - DATA-MCP-GOV-001
  - SEC-MCP-GOV-001
dependencies:
  - CELL-MCP-GOV-001
allowed_paths:
  - .shirube/**
  - docs/**
  - README.md
forbidden_paths:
  - .env
  - secrets/**
  - bin/**
  - cli/**
  - core/**
  - server.ts
  - .github/workflows/**
acceptance_criteria:
  - id: AC-MCP-005-001
    statement: Protected resources and approval requirements are documented.
    linked_req_ids:
      - DATA-MCP-GOV-001
  - id: AC-MCP-005-002
    statement: Read-only and mutation-capable access are distinguished.
    linked_req_ids:
      - SEC-MCP-GOV-001
required_tests:
  - TEST-MCP-GOV-001
  - TEST-MCP-GOV-002
required_evidence:
  - changed files
  - yaml parse results
  - scope confirmation
  - Shirube command review result
non_goals:
  - No runtime sandbox change.
  - No credential or secret change.
  - No deployment change.
stop_conditions:
  - Implementation would touch forbidden_paths.
  - Resource access behavior would change.
  - Secret, credential, production DB, or provider access is required.
waiver_refs: []
execution_contract:
  canonical_term: Goal-directed bounded execution
  shorthand: Goal-mode Implementation
  allowed_commands:
    - git diff --check
    - YAML parse for .shirube/**/*.yaml
    - existing lightweight smoke checks
  forbidden_commands:
    - git push --force
    - destructive production commands
    - active workflow or branch protection mutation
  handoff_conditions:
    - Shirube command review
    - repository owner/domain designer confirmation
  completion_evidence:
    - changed files
    - commands run
    - validation results
    - next required gate
