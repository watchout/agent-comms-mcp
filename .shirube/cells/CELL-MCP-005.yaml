schema_version: shirube-cell/v1
status: draft_candidate
cell_id: CELL-MCP-005
title: Resource boundary policy
risk_tier: R2
repo_id: watchout/agent-comms-mcp
objective: Draft boundaries for database, queue, runtime, provider, filesystem, and GitHub resource access.
scope:
  allowed_paths:
    - .shirube/**
    - docs/**
    - README.md
  forbidden_paths:
    - bin/**
    - core/**
    - cli/**
    - server.ts
    - .github/workflows/**
non_goals:
  - No runtime sandbox change.
  - No credential or secret change.
  - No deployment change.
acceptance_criteria:
  - Protected resources and approval requirements are documented.
  - Read-only versus mutation-capable access is distinguished.
  - Enforcement remains warn-only.
required_gates:
  - Shirube command review
  - repository owner/domain designer confirmation
