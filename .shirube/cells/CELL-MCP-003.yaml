schema_version: shirube-cell/v1
CELL-ID: CELL-MCP-003
SPEC-ID: SPEC-MCP-GOV-001
risk_tier: R2
goal: Draft the invocation review policy for MCP/tool calls that require review, exact fences, or human approval.
covered_req_ids:
  - REQ-MCP-GOV-002
  - SEC-MCP-GOV-001
dependencies:
  - CELL-MCP-GOV-001
allowed_paths:
  - .shirube/**
  - docs/**
  - README.md
forbidden_paths:
  - .env
  - secrets/**
  - bin/**
  - cli/**
  - core/**
  - server.ts
  - .github/workflows/**
acceptance_criteria:
  - id: AC-MCP-003-001
    statement: Invocation classes map to required evidence, exact fences, and review gates.
    linked_req_ids:
      - REQ-MCP-GOV-002
  - id: AC-MCP-003-002
    statement: Queue, runtime, delivery, and state-daemon mutations remain blocked without future approved Cells.
    linked_req_ids:
      - SEC-MCP-GOV-001
required_tests:
  - TEST-MCP-GOV-001
  - TEST-MCP-GOV-002
required_evidence:
  - changed files
  - yaml parse results
  - scope confirmation
  - Shirube command review result
non_goals:
  - No live invocation blocking.
  - No queue claim behavior change.
  - No state-daemon or runtime supervisor change.
stop_conditions:
  - Implementation would touch forbidden_paths.
  - Queue, runtime, or outbound invocation behavior would change.
  - A terminal outcome or release decision is required.
waiver_refs: []
execution_contract:
  canonical_term: Goal-directed bounded execution
  shorthand: Goal-mode Implementation
  allowed_commands:
    - git diff --check
    - YAML parse for .shirube/**/*.yaml
    - existing lightweight smoke checks
  forbidden_commands:
    - git push --force
    - destructive production commands
    - active workflow or branch protection mutation
  handoff_conditions:
    - Shirube command review
    - repository owner/domain designer confirmation
  completion_evidence:
    - changed files
    - commands run
    - validation results
    - next required gate
