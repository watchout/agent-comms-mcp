schema_version: shirube-control-handoff/rapid-lite/v1
mode: rapid-lite
profile: hotel-lite
control_handoff_id: CH-MCP-805-V3-RAPID-LITE-PILOT-001
parent_ssot: https://github.com/watchout/ai-dev-framework/issues/458
matrix_ref: https://github.com/watchout/ai-dev-framework/blob/c9367c91eeae9df8cfc23ffd8ddbadfdb0df005f/.shirube/gate-contracts/shirube-v3-rapid-lite-gate-contract-matrix.yaml
framework_ref: shirube-v3-rapid-lite@c9367c91eeae9df8cfc23ffd8ddbadfdb0df005f
repo_spec_ref: .shirube/repo-spec.yaml
premise_ref: .shirube/specs/SPEC-MCP-AUN-V2V3-FOUNDATION-001.md
repo: watchout/agent-comms-mcp
repo_local_issue: https://github.com/watchout/agent-comms-mcp/issues/802
pr_head_sha: null
owner:
  role: repo_owner
  actor: watchout
next_role: shirube_command_review
spec_review_state: ready_for_report_only_pilot
owner_confirmation_required: false

execution_context:
  primary_target_repo: watchout/agent-comms-mcp
  primary_target_pr: 805
  primary_development_subject: AUN V2/V3 foundation premise
  current_work_order: Full Shirube application posture for agent-com scope; no runtime implementation in this PR.
  support_repos:
    watchout/ai-dev-framework: framework_feedback_support_only
    watchout/omotenasuai-control: control_source_only
    omotenasuai_product_repos: not_current_target_unless_explicitly_assigned
  mandatory_reset_before_implementation:
    - pwd
    - git_root
    - origin_remote
    - current_branch
    - HEAD
    - current_work_order
    - target_repo
    - support_repos
    - changed_files
  stop_if:
    - actual_repo_is_not_watchout_agent_comms_mcp
    - support_repo_pr_is_treated_as_current_implementation_target
    - ADF_488_is_treated_as_current_implementation_target
    - omotenasuai_product_repo_is_treated_as_current_target_without_explicit_assignment

shirube_application_posture:
  mode: full_overlay_required_before_aun_implementation
  partial_pilot_allowed_for_behavior_changing_work: false
  framework_support_refs:
    - https://github.com/watchout/ai-dev-framework/issues/431
    - https://github.com/watchout/ai-dev-framework/issues/458
    - https://github.com/watchout/ai-dev-framework/issues/487
    - https://github.com/watchout/ai-dev-framework/pull/488

rps_scope:
  shirube_owns:
    - report-only review of foundation premise artifacts
    - structural handoff, path, validation, and evidence checks
    - would_block and owner_must_not_merge evidence reporting
  shirube_does_not_own:
    - runtime behavior
    - MCP/tool behavior
    - queue mutation
    - state-daemon behavior
    - provider delivery
    - database migration
    - secret or credential access
    - workflow enforcement
    - branch protection or rulesets
    - AUN activation
    - merge authority

escalation_route: "If any protected runtime, queue, provider, workflow, ruleset, branch-protection, secret, DB, or AUN activation change is requested, stop Rapid/Lite and require Standard/Enterprise R3 owner/security/CTO/operator approval. This PR is docs/scaffold premise only and does not touch those surfaces."

acceptance_criteria:
  - PR remains draft during report-only pilot.
  - Changed files remain inside .shirube/** and docs/**.
  - No runtime, workflow, ruleset, branch protection, package, lockfile, DB, secret, queue, state-daemon, provider delivery, or AUN activation changes occur.
  - Report-only findings are posted as evidence before Shirube command review.

validation:
  required_commands:
    - git diff --check
    - git diff --check origin/main...HEAD
    - YAML parse for .shirube/**/*.yaml
    - bash scripts/detect-breaking-changes.sh origin/main
    - Shirube V3 Rapid/Lite report-only run
  test_expectations:
    - changed file list is checked against allowed and forbidden globs
    - owner decision evidence is exact-head and report-only only
    - design-rules acknowledge protected-surface mentions as docs-only with escalation route
  required_evidence:
    - PR_head_SHA
    - changed_files
    - validation_commands
    - validation_results
    - owner_decision
    - rapid_lite_report_result
    - execution_context_reset_result

owner_decision:
  required_before_merge: true
  allowed_verdicts:
    - SELECTED_FOR_REPORT_ONLY_PILOT_NOT_MERGE_AUTHORIZATION
    - APPROVED_EXACT_HEAD
    - CHANGES_REQUIRED
    - BLOCKED
  exact_head_sha: null
  decision_ref: null

cell:
  CELL-ID: CELL-MCP-AUN-FOUNDATION-001
  cell_type: scaffold
  risk_class: R2
  goal: Apply Shirube V3 Rapid/Lite report-only pilot to the AUN V2/V3 foundation premise PR.
  non_scope:
    - runtime code changes
    - MCP/tool behavior changes
    - queue mutation
    - state-daemon changes
    - provider delivery changes
    - database migration
    - secret access
    - workflow changes
    - branch protection or ruleset changes
    - required check activation
    - AUN activation
    - ready-for-review transition
    - merge authorization
  allowed_paths:
    - .shirube/**
    - docs/**
    - README.md
  forbidden_paths:
    - bin/**
    - cli/**
    - core/**
    - src/**
    - server.ts
    - scripts/**
    - .github/workflows/**
    - package.json
    - package-lock.json
    - bun.lockb
    - pnpm-lock.yaml
    - deploy/**
    - .env
    - .env.*
    - secrets/**
    - "**/branch-protection/**"
    - "**/ruleset/**"
  stop_conditions:
    - changed file outside allowed_paths
    - forbidden path touched
    - protected surface requested
    - missing exact head evidence
    - missing or placeholder validation evidence
    - owner decision missing
    - runtime implementation requested
    - execution context target repo mismatch
    - framework support repo treated as primary target
  authorized_next_cells: []

implementation_boundary:
  summary: "Add report-only Shirube V3 Rapid/Lite handoff evidence for PR #805 without changing runtime, workflow, rule, or protected behavior."
  expected_pr_count: 1
  forbidden_operations:
    - merge
    - approve
    - mark_ready_for_review
    - branch protection mutation
    - ruleset mutation
    - required check activation
    - production or deploy mutation
    - secret read or write
    - live AUN, Discord, DB, queue, LaunchAgent, or external repository mutation

post_merge:
  required_when_done_claimed: true
  required_evidence:
    - merge_commit
    - merged_at
    - post_merge_smoke_or_NA
    - next_step
    - no_unresolved_follow_up_blocker

legacy_source_boundary:
  legacy_sources_may_inform: true
  legacy_sources_are_truth: false
  required_current_truth_ref: repo_local_issue_or_control_handoff
