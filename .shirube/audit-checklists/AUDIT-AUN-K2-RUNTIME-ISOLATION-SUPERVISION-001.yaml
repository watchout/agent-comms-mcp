  - {audit_item_id: K2-AUDIT-005, requirement_id: AUN-K2-REQ-004, test_ids: [K2-TC-009, K2-TC-010], pass_predicate: independent adapters; hung-seat added p95 at most 100ms; cross-seat mutation zero}
  - {audit_item_id: K2-AUDIT-006, requirement_id: AUN-K2-REQ-005, test_ids: [K2-TC-011, K2-TC-013], pass_predicate: RTO at most 30s; RPO zero; old adapter closed; notification loss converges within 2s}
