verdict_contract:
  PASS: every item passes on the same exact head with reproducible evidence
  PASS_WITH_WARN: nonblocking residual risk only; no missing path, test, evidence, or live-effect ambiguity
  BLOCK: any stale evidence, path drift, traceability gap, stale mutation, shared DB, V1/provider effect, or self-audit
next_action:
  blocking: true
  actor: codex-audit or discord-auditor
  active_function: evidence_audit_gate
  action: Independently audit the published draft PR exact head against K2-AUDIT-001 through K2-AUDIT-010 without implementing fixes.
  delivery: durable structured verdict on the K2 draft PR
  input_refs:
    - https://github.com/watchout/agent-comms-mcp/issues/794#issuecomment-4989397972
    - exact draft PR head evidence
  deliverable: exact-head PASS, PASS_WITH_WARN, or BLOCK with complete next_action
