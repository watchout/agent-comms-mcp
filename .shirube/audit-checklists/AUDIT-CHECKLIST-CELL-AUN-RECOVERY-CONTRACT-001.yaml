verdict_contract:
  PASS: Every audit item passes on the same exact head with reproducible evidence and zero unauthorized effect.
  REQUEST_CHANGES: One or more bounded correctable artifact findings exist and each names gate file predicate and exact replacement.
  ESCALATE: Source intent conflicts protected decision is inferred or correction requires widening frozen authority.
