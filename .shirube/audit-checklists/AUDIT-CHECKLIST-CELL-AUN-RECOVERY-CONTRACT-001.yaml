verdict_contract:
  PASS: Every audit item passes on the same exact head with reproducible evidence and zero unauthorized effect.
  REQUEST_CHANGES: One or more bounded correctable artifact findings exist; each finding names the gate, file, predicate, and exact required replacement.
  ESCALATE: Source intent conflicts, a protected decision is being inferred, or correction would require widening the frozen graph or authority boundary.
stop_conditions:
  - The auditor is ARC, AUN, or another author of the candidate.
  - Evidence is not bound to one exact head and tree.
  - Validation requires runtime, DB, queue, LaunchAgent, manifest, credential, or provider mutation.
  - The PR is Ready, approved, merged, or no longer based on the pinned parent.
  - A protected owner decision is missing or treated as implied.
next_action:
  blocking: true
  actor: codex-audit
  active_function: evidence_audit_gate
  action: Run this checklist on the exact Draft Control PR head and publish one immutable verdict without editing candidate files.
  delivery: GitHub PR verdict comment plus AUN return to ARC and AUN.
  input_refs:
    - https://github.com/watchout/agent-comms-mcp/issues/602
    - .shirube/cell-graphs/GRAPH-AUN-AUTORECEIVE-FLEET-RECOVERY-001.yaml
    - .shirube/cells/CELL-AUN-RECOVERY-CONTRACT-001.yaml
    - .shirube/specs/SPEC-AUN-AUTORECEIVE-FLEET-RECOVERY-001.md
    - .shirube/control-handoffs/CH-AUN-RECOVERY-CONTRACT-001.yaml
  scope:
    allowed: Read-only exact-head artifact and trace validation.
    forbidden: Edits, self-fix, approval, merge, Ready, runtime, DB, queue, LaunchAgent, manifest, provider, credential, or production effects.
  deliverable: Exact-head PASS, REQUEST_CHANGES, or ESCALATE with complete evidence and next_action.
  completion_evidence: Immutable GitHub URL, exact head and tree, per-item verdicts, validation commands and outputs, artifact hashes, and AUN delivery receipt.
