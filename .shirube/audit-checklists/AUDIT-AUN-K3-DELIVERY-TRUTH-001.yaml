verdict_contract:
  PASS: every item passes on one exact head with reproducible evidence
  PASS_WITH_WARN: nonblocking residual risk only; no missing truth, effect, scope, or crash evidence
  BLOCK: any stale evidence, path drift, duplicate effect, synthetic success, unknown retry, schema change, shared DB, V1/provider effect, or self-audit
next_action:
  blocking: true
  actor: codex-audit or discord-auditor
  active_function: evidence_audit_gate
  action: Independently audit the published K3 draft PR exact head without implementing fixes.
  delivery: durable structured verdict on the K3 draft PR
  input_refs:
    - https://github.com/watchout/agent-comms-mcp/issues/794#issuecomment-4989429763
    - exact draft PR head evidence
  deliverable: exact-head PASS, PASS_WITH_WARN, or BLOCK with complete next_action
