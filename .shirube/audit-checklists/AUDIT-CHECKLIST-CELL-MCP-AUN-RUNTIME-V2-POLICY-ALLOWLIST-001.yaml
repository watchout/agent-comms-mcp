    source: "future_implementation_gate"
    verification_method: "semantic"
    required: true
    prompt: "Confirm the future implementation checklist covers deterministic policy, no env or option widening, non-kodama dry-run only, before-DB rejection, and no activation."
    expected_evidence:
      - "deterministic policy"
      - "dry-run only"
      - "before DB access"
      - "AUN activation"
