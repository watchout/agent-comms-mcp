      - "CH-AUN-RUNTIME-V2-POLICY-ALLOWLIST-001"
  - item_id: "AUDIT-AUN-POLICY-ALLOWLIST-ROUTE-002"
    source: "handoff_acceptance"
    verification_method: "semantic"
    required: true
    prompt: "Confirm the handoff preserves #792 scope for deterministic runtime-v2 policy allowlist implementation while keeping this PR route-metadata only."
    expected_evidence:
      - ".shirube/control-handoffs/CH-AUN-RUNTIME-V2-POLICY-ALLOWLIST-001.yaml"
      - "route_metadata_for_future_implementation"
      - "runtime code changes"
  - item_id: "AUDIT-AUN-POLICY-ALLOWLIST-ROUTE-003"
    source: "protected_surface_boundary"
    verification_method: "semantic"
    required: true
    prompt: "Confirm changed files are limited to route metadata and report-only workflow route table paths."
    expected_evidence:
