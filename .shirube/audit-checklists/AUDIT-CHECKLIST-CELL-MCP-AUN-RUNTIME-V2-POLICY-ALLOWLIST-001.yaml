      - ".github/workflows/shirube-rapid-lite-gates-report.yml"
  - item_id: "AUDIT-AUN-POLICY-ALLOWLIST-ROUTE-004"
    source: "protected_surface_boundary"
    verification_method: "semantic"
    required: true
    prompt: "Confirm this route metadata PR does not change runtime code, package manifest, DB schema, provider/state-daemon/MCP behavior, required checks, branch protection, rulesets, or AUN activation."
