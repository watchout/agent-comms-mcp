  scope:
    - "FLOW-SAFETY-002 / FLOW-SAFETY-009: external gate subject not bound"
    - "DR-CODE-001: duplicate already present on the base commit inside a changed file"
  not_in_scope:
    - cell binding
    - audit checklist
    - control-state completeness
    - review-plan
    - DR-DATA-001
    - Layer 0
    - product review by devauditor
    - owner exact-head
  until: "retirement of .shirube/runtime (switch plan D3)"
  note: "The runtime cannot scope a pilot exception: owner_must_not_merge=false applies to every report_only BLOCK. The scope above is held by the decision text and by devauditor, who does not approve while a non-exempt check is BLOCKED."
