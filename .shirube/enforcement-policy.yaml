owner_observed: true
owner:
  role: repo_owner
  actor: watchout
required_checks:
  enabled: false
branch_protection:
  unchanged: true
rulesets:
  unchanged: true
calibration:
  started_at: 2026-06-25T02:00:01Z
  minimum_prs: 3
  false_positive_review_required: true
report_only_semantics:
  aggregate_would_block_sets_owner_must_not_merge: true
  ci_should_fail: false
  owner_must_not_merge_without_exception: true
promotion:
  from: report_only
  next:
    - owner_block
    - ci_hard_block
    - required_check
  required_evidence:
    - stable report-only findings
    - owner accepts warning/block policy
    - explicit protected-settings Cell before required checks
non_scope:
  - branch protection mutation
  - ruleset mutation
  - required check activation
  - CI hard-blocking
  - external repository mutation
  - runtime/API/DB/package/deploy behavior

pilot_exception:
  approved: true
  decision_id: OD-AUN-OLD-RAPID-LITE-PILOT-EXCEPTION-20260929-001
  control_source_ref:
    url: https://github.com/watchout/agent-comms-mcp/issues/940#issuecomment-5884428162
