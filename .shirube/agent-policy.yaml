schema_version: shirube-agent-policy/v1
policy_id: AGENT-POLICY-MCP-GOV-001
permission_boundary:
  allowed_commands:
    - git diff --check
    - ruby YAML.parse for .shirube/**/*.yaml
    - existing lightweight smoke checks
    - node scripts/shirube-full-adoption-check.mjs
    - git status
    - git diff
  forbidden_commands:
    - git push --force
    - destructive production commands
    - commands that mutate branch protection or repository rulesets
    - commands that deploy, restart, or activate production services without approved Cell and owner/CTO GO
  allowed_paths:
    - .shirube/**
    - docs/**
    - README.md
    - .github/pull_request_template.md
    - .github/workflows/pr-checks.yml
    - scripts/shirube-full-adoption-check.mjs
  forbidden_paths:
    - .env
    - secrets/**
    - bin/**
    - cli/**
    - core/**
    - server.ts
    - .github/workflows/** except .github/workflows/pr-checks.yml for CELL-MCP-SHIRUBE-FULL-ADOPTION-001
    - deploy/**
  allowed_mcp_tools:
    - read_only_repo_inspection
    - read_only_diagnostics
    - local_validation
    - github_evidence_comment
  approval_required_mcp_tools:
    - queue_claim_or_lease_mutation
    - lifecycle_transition
    - runtime_supervisor_change
    - outbound_provider_delivery_change
    - schema_or_migration_change
    - audit_log_or_evidence_model_change
    - github_write
  forbidden_mcp_tools:
    - branch_protection_change
    - ruleset_change
    - production_deploy
    - secret_rotation
    - external_repo_mutation
    - live_multi_agent_automation_activation
  secret_access_policy: "No secret read unless explicitly approved in the Cell and required by Impl; this scaffold grants no secret access."
  memory_read_policy: "Read only memory explicitly authorized by the Cell; GitHub remains the durable source of truth."
  memory_write_policy: "No memory write unless explicitly authorized by the Cell and recorded as evidence."
  external_send_policy: "No external send or dispatch unless explicitly authorized by the Cell; this scaffold authorizes no AUN activation."
agent_execution_profiles:
  - agent_id: codex
    agent_name: Codex
    agent_type: codex
    supported_execution_modes:
      - goal-directed-bounded-execution
      - local-repo-edit
      - validation-and-pr-draft
    supports_goal_directed_execution: true
    supports_filesystem_scope_constraints: true
    supports_command_constraints: true
    supports_structured_output: true
    supports_test_execution: true
    supports_pr_creation: true
    supports_issue_comment_updates: true
    supports_artifact_reporting: true
    instruction_adapter: codex_goal_mode_adapter
    completion_evidence_requirements:
      - changed files
      - commands run
      - test results
      - known failures
      - PR / commit / artifact links
      - next required gate
    risk_tier_limit_without_human_approval: R2
  - agent_id: claude
    agent_name: Claude Code
    agent_type: claude
    supported_execution_modes:
      - goal-directed-bounded-execution
      - local-repo-edit
      - validation-and-pr-draft
    supports_goal_directed_execution: true
    supports_filesystem_scope_constraints: true
    supports_command_constraints: true
    supports_structured_output: true
    supports_test_execution: true
    supports_pr_creation: true
    supports_issue_comment_updates: true
    supports_artifact_reporting: true
    instruction_adapter: claude_code_adapter
    completion_evidence_requirements:
      - changed files
      - commands run
      - test results
      - known failures
      - PR / commit / artifact links
      - next required gate
    risk_tier_limit_without_human_approval: R2
  - agent_id: generic-coding-agent
    agent_name: Generic Coding Agent
    agent_type: generic_coding_agent
    supported_execution_modes:
      - goal-directed-bounded-execution
      - patch-proposal
    supports_goal_directed_execution: true
    supports_filesystem_scope_constraints: true
    supports_command_constraints: true
    supports_structured_output: true
    supports_test_execution: false
    supports_pr_creation: false
    supports_issue_comment_updates: false
    supports_artifact_reporting: true
    instruction_adapter: generic_structured_handoff_adapter
    completion_evidence_requirements:
      - proposed changed files
      - scope mapping
      - known limitations
      - required human validation
    risk_tier_limit_without_human_approval: R1
  - agent_id: human-executor
    agent_name: Human Executor
    agent_type: human_executor
    supported_execution_modes:
      - manual-execution
      - review
      - approval
    supports_goal_directed_execution: true
    supports_filesystem_scope_constraints: true
    supports_command_constraints: true
    supports_structured_output: false
    supports_test_execution: true
    supports_pr_creation: true
    supports_issue_comment_updates: true
    supports_artifact_reporting: true
    instruction_adapter: human_markdown_work_order_adapter
    completion_evidence_requirements:
      - decision or action taken
      - checks reviewed or run
      - approval or rejection rationale
      - next required gate
    risk_tier_limit_without_human_approval: R3
execution_contract:
  canonical_term: Goal-directed bounded execution
  CELL-ID: CELL-MCP-GOV-001
  SPEC-ID: SPEC-MCP-GOV-001
  IMPL-ID: IMPL-MCP-GOV-001
  risk_tier: R2
  allowed_paths:
    - .shirube/**
    - docs/**
    - README.md
  forbidden_paths:
    - .env
    - secrets/**
    - bin/**
    - cli/**
    - core/**
    - server.ts
    - .github/workflows/**
    - deploy/**
  allowed_commands:
    - git diff --check
    - ruby YAML.parse for .shirube/**/*.yaml
    - existing lightweight smoke checks
  forbidden_commands:
    - git push --force
    - destructive production commands
    - required-check activation
    - branch protection or ruleset mutation
    - runtime or deployment activation
  required_tests:
    - git_diff_check
    - yaml_parse_check_for_shirube_yaml
    - existing_lightweight_smoke_if_available
  required_evidence:
    - changed files
    - commands run
    - validation results
    - scope confirmation
    - next required gate
  non_goals:
    - No runtime behavior changes.
    - No AUN runtime behavior changes.
    - No direct branch protection or ruleset changes when GitHub API/plan blocks them.
    - No AUN activation.
  stop_conditions:
    - Any change outside allowed_paths is required.
    - Runtime, MCP, queue, state-daemon, deployment, workflow, or ruleset behavior would change.
    - Repo owner/domain designer confirmation is required for authoritative repo-spec decisions.
  handoff_conditions:
    - Shirube command review
    - Repository owner/domain designer confirmation of .shirube/repo-spec.yaml
