acceptance_criteria:
  - Install-plan dry-run JSON includes no_apply true.
  - Install-plan dry-run JSON includes approved_checkout_ref matching the requested commit.
  - Install-plan dry-run JSON includes materialization_required.
  - Missing checkout fixtures report materialization_required true with missing checkout, working_directory, and entry path evidence.
  - Materialized checkout fixtures report materialization_required false with materialization_status materialized and no missing paths.
  - Install-plan dry-run JSON includes host_apply evidence with launchd_apply_performed false and restart_performed false.
  - State-daemon readiness and read-only gate pack remain read-only and report no mutation.
  - Overall CP80 may remain NO_GO for non-scope operational blockers; this Cell does not claim full CP80 GO.
