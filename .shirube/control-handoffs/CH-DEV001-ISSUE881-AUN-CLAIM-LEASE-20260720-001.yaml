acceptance_criteria:
  - Active claims renew only when queue_id and expected_claim_expires_at match the current lease fence.
  - A stale claimant cannot renew, reclaim, reply, close, or otherwise produce terminal effects after losing the lease.
  - Fenced reclaim permits only the current claimant to progress and preserves exactly-once terminal behavior.
  - Durable reply-close remains correct when notify delivery is absent or fails; notification status does not substitute for durable terminal evidence.
  - CLI help and behavior require the exact queue_id and expected_claim_expires_at inputs for the operator claim-renewal path.
  - docs/operations/codex-runtime-adapter-bootstrap.md documents the operator invocation, success evidence, stale-fence failure, and no-mutation safety boundary.
  - docs/design/durable-reply-close-path.md documents lease fencing, exactly-once reply-close, and notify-absent semantics.
  - The final PR 882 diff contains only the twelve allowed paths and contains no workflow, control, DB schema, migration, deploy, activation, canary, or rollout mutation.
