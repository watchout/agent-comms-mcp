    - server.ts
    - cli/**
    - adapters/**
    - db/**
    - package.json
    - package-lock.json
    - bun.lockb
    - pnpm-lock.yaml
    - .env*
    - secrets/**
    - deploy/**
  protected_surfaces:
    declared:
      - runtime code
      - database
      - active workflows
    touched: true
    details:
      - Future implementation must be kodama-only and exact-fenced.
      - Future implementation must require explicit live-canary intent and must not broaden runtime-v2 to other agents.
      - This route metadata PR only wires report-only routing; it does not execute a live claim.
  stop_conditions:
    - implementation requires non-kodama agent support
    - implementation requires production live claim execution during tests
    - exact queue_id, message_id, and created_after fences cannot be enforced before mutation
    - missing live-canary authorization cannot fail closed before mutation
    - DB schema or migration is required
    - state-daemon, provider, MCP/tool behavior, or AUN activation is required
    - independent audit fails
implementation_boundary:
  summary: Add kodama-only exact-fenced live claim canary mechanics for runtime-v2 without running production live claim in the PR.
  expected_pr_count: 1
  forbidden_operations:
    - approve
    - merge
    - draft removal
    - production live claim execution
    - fleet rollout
    - allowlist expansion beyond kodama
    - DB migration
    - provider delivery
    - state-daemon mutation
    - AUN activation
acceptance_criteria:
  - CLI rejects non-kodama agents before DB open.
  - CLI requires --json and exact queue_id, message_id, and created_after fence.
  - CLI requires explicit live-canary authorization flag before any mutation path can run.
  - Live claim implementation reuses dry-run/read-only evaluation and fails closed unless the target is claimable.
  - Live claim mutation is atomic and bounded to the exact fenced queue row.
  - Successful live canary result records claim owner/source evidence compatible with existing queue-work expected claim source.
  - Stale holder, wrong fence, non-pending row, runtime-not-alive, and conflicting claim cases do not mutate.
  - Tests use isolated fixture DB only and never production DB.
  - Existing #788 queue-work runner behavior remains compatible.
validation:
  required_commands:
    - git diff --check
    - YAML parse for .shirube/**/*.yaml
    - bun test tests/aun-runtime-v2-live-claim.test.ts tests/aun-runtime-v2-synthetic-claim.test.ts tests/aun-runtime-v2-claim-plan.test.ts tests/aun-runtime-v2-plan.test.ts tests/aun-runtime-v2.test.ts tests/run-queue-work-plan.test.ts tests/queue-work.test.ts tests/contract/test_aun_cli_real_invocation.test.ts
  required_evidence:
