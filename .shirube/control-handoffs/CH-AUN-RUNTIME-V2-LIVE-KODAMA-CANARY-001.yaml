  CELL-ID: CELL-MCP-AUN-RUNTIME-V2-LIVE-KODAMA-CANARY-001
  cell_type: implementation
  risk_class: R3
  goal: Add the smallest kodama-only runtime-v2 live claim canary implementation after read-only plan, claim dry-run, and synthetic claim have merged.
  governance_route: R3 protected live canary implementation with independent audit and owner exact-head authorization before ready or merge handling.
  non_scope:
    - running a production live claim during implementation
    - fleet rollout
    - policy allowlist expansion beyond kodama
    - default enable
    - DB schema or migration
    - state-daemon behavior
    - provider delivery
    - MCP/tool behavior
    - required check activation
    - branch protection or ruleset mutation
    - AUN activation
  allowed_paths:
    - bin/aun.ts
    - bin/aun/runtime-v2.ts
    - core/aun-runtime-v2-live-claim.ts
    - tests/aun-runtime-v2-live-claim.test.ts
    - .shirube/control-handoffs/CH-AUN-RUNTIME-V2-LIVE-KODAMA-CANARY-001.yaml
    - .shirube/audit-checklists/AUDIT-CHECKLIST-CELL-MCP-AUN-RUNTIME-V2-LIVE-KODAMA-CANARY-001.yaml
    - .shirube/evidence/EVIDENCE-CELL-MCP-AUN-RUNTIME-V2-LIVE-KODAMA-CANARY-001.yaml
