acceptance_criteria:
  - PM-01 preserves typed names, addresses, phones, emails, evidence-backed entity links, and multiple values.
  - PM-02 preserves value_id and exact plaintext while classification revisions change.
  - PM-03 prevents unsupported person merges for name matches or shared phone numbers.
  - PM-04 returns the same value references after duplicate ingest or lost response.
  - PM-05 round-trips eligible synthetic bytes exactly.
  - PM-06 excludes API keys and hidden instructions from storage and output.
  - PM-07 ignores caller-supplied agent_id or admin claims for reveal authority.
  - PM-08 denies mixed-scope batches atomically without existence disclosure.
  - PM-09 reveals only required fields to an authorized actor, purpose, and destination.
  - PM-10 denies reveal after source revocation or purpose mismatch, including old packs.
  - PM-11 has no plaintext fallback and no commit or ACK when keys or database writes fail.
  - PM-12 rejects ciphertext, tag, AAD, or row substitution.
  - PM-13 never treats marker-like user text as a trusted reference.
  - PM-14 sends no plaintext to unavailable or unapproved Jev or LLM services and retains protected unknowns.
  - PM-15 does not treat uninspected free text as non-sensitive.
  - PM-16 does not let model confidence remove protection or grant authority.
  - PM-17 preserves structurally public GitHub IDs, URLs, epochs, and backup fixtures.
  - PM-18 does not concatenate the four known numeric fixtures into phone numbers.
  - PM-19 preserves known hotel-ID and explicit phone-number expectations.
  - PM-20 distinguishes irreversible legacy REDACTED data from authorized new references.
  - PM-21 keeps plaintext, keys, and guessable plaintext hashes out of search, recovery, logs, embeddings, and traces.
  - PM-22 proves reference/value consistency and observable failure across restore, rotation, and rollback.
  - PM-23 prevents lifecycle or review handoff among AUN, Shirube, and Kodama from granting reveal authority.
  - PM-24 fails closed and finitely for audit failure, invalid offsets, and oversized requests.
  - PM-25 leaves zero plaintext copies across AUN message, queue, outbox, eventlog, metadata, and diagnostics for the same synthetic sensitive value.
  - PM-26 preserves canonical payload identity, claim, lease, and dedup across reappend, redelivery, and key rotation without plaintext dual-write.
  - PM-27 applies protection to full, preview, ancestor, external-history, and attachment paths without plaintext bypass.
  - PM-28 preserves issuer distinction across AUN to Kusabi and reports missing source values when an issuer is unavailable.
