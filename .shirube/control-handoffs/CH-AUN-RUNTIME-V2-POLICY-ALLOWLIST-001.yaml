acceptance_criteria:
  - Runtime-v2 policy source is deterministic, checked in, and included in package distribution.
  - Plan output includes policy_id, policy_version, policy_source, policy_agent_mode, allowed_agent_ids, and live_agent_ids.
  - Public runtime-v2 plan and claim dry-run outputs include policy metadata.
  - Environment variables cannot add allowed agents.
  - Imported options cannot add allowed agents.
  - Unknown and explicitly excluded agents reject before DB access on runtime-v2 execute, plan, and claim dry-run surfaces.
  - Policy-listed non-kodama agents may dry-run only.
  - Policy-listed non-kodama live/non-dry-run attempts reject before DB access.
  - Live_agent_ids contains kodama only.
  - #788 live path remains compatible for kodama.
  - No DB schema, queue cleanup/recovery, provider, state-daemon, MCP/tool, workflow, required check, branch protection, ruleset, or AUN activation change is included.
