implementation_boundary:
  summary: Worker + runtime adapters + dialect groundwork + fixtures + this Cell's report-only route metadata.
  expected_pr_count: 1
  forbidden_operations:
    - approve
    - merge
    - queue or DB mutation
    - launchd mutation
    - secret or deployment mutation
    - runtime activation
acceptance_criteria:
  - Pull-claim worker processes turns with zero terminal input in fixtures; identity-based restart recovery; runtime crash closes terminal as failed.
  - Both engine adapters bind the same seam with the same strict v2_turn_result_v1 contract and fail closed on every deviation.
  - Canary/live acceptance evidence exists (production pilot, #794 comment 4924913779).
  - Full eventlog regression suite stays green.
validation:
  required_commands:
    - git diff --check
    - YAML parse for .shirube/**/*.yaml
    - bun test tests/eventlog/
  required_evidence:
    - PR_head_SHA
    - changed_files
    - validation_commands
    - validation_results
owner_decision:
  required_before_merge: true
  evidence_source: external_owner_decision_comment_or_workflow_input
  committed_pending_policy_only: true
  allowed_verdicts:
    - APPROVED_EXACT_HEAD
    - CHANGES_REQUIRED
    - BLOCKED
  exact_head_sha: null
  decision_ref: null
post_merge:
  required_when_done_claimed: true
  required_evidence:
    - merge_commit
    - merged_at
    - post_merge_smoke_or_NA
    - next_step
