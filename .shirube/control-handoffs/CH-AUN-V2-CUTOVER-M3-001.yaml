    - tests/eventlog/eventlog-runtimes-m35.test.ts
    - tests/eventlog/eventlog-bot-to-bot-roundtrip.test.ts
    - .shirube/control-handoffs/CH-AUN-V2-CUTOVER-M3-001.yaml
    - .shirube/audit-checklists/AUDIT-CHECKLIST-CELL-MCP-AUN-V2-CUTOVER-M3-001.yaml
