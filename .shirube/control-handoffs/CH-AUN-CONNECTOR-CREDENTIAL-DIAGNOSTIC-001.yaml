acceptance_criteria:
  - CLI command is aun connector credential-diagnostic [--agent-id <id>] [--provider discord] --json.
  - Output schema is aun-connector-credential-diagnostic/v1.
  - Healthy connector credential evidence reports zero blockers.
  - Raw-secret-like refs are redacted and reported.
  - Duplicate active secret refs are diagnosed.
  - Connector/credential owner mismatch and missing usable credential evidence are diagnosed.
  - CLI smoke emits JSON from an existing SQLite DB opened readonly/no-create.
  - "Successful diagnostic output includes applied_mutations: []."
