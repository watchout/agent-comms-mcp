allowed_operations:
  - Materialize the exact five Control artifact paths from the pinned base.
  - Parse every YAML file with aliases disabled.
  - Run read-only cross-reference and trace-count validation.
  - Run git diff --check and verify the exact changed-path set.
  - Commit and push one Control-only successor branch.
  - Open one Draft PR without changing Ready state or merging.
  - Publish one immutable Issue 602 V3 amendment and read it back through the GitHub API.
  - Deliver the exact PR head and evidence to an independent evidence_audit_gate.
forbidden_operations:
  - Any sixth repository path.
  - Product, queue, state-daemon, finalizer, scheduler, runtime, provider, connector, or supervisor implementation.
  - Database DDL or DML, queue traversal, next, inbox, FIFO drain, manual terminalization, or raw SQL repair.
  - LaunchAgent, launchctl, tmux, process, listener, runtime, profile, credential, manifest, or production mutation.
  - Discord live write, live queue canary, fleet activation, controlled reboot, or rollback execution.
  - Agent-name inference as production classification authority.
  - Owner GO, OD-AUN-001, OD-AUN-002, Ready, approval, merge, deploy, rollout, release, or VERIFIED_DONE mutation.
  - ARC self-audit or AUN requester self-audit as independent evidence.
required_evidence:
  - Exact base commit and tree readback.
  - Exact changed-file list of five paths and no other paths.
  - SHA-256 for every changed artifact and aggregate canonical path-hash list.
  - Aliases-disabled YAML safe parse for every YAML artifact.
  - Six ordered Cells, 14 requirements, 14 acceptance criteria, 18 tests, and 15 completion predicates.
  - Requirement to acceptance and test trace has zero missing or unknown refs.
  - Design Flow G1 through G7 candidate result PASS with protected effects zero.
  - Draft PR URL, exact head, exact tree, and parent equals pinned base commit.
  - Issue 602 amendment URL, API byte equality, body SHA-256, and parse/readback result.
  - AUN delivery receipt to the requestor and independent auditor route receipt.
exact_stop_conditions:
  - Current main differs from the pinned base before branch creation or parent verification.
  - Any artifact requires runtime facts not present in the source evidence to claim PASS.
  - The raw observed count 39 is promoted to production denominator N.
  - Any path outside the exact five changes.
  - Any protected effect or host mutation is attempted.
  - The requirement, acceptance, test, checklist, or Cell cross-reference validation fails.
  - GitHub API readback differs from the saved amendment body.
  - The Draft PR cannot remain non-Ready and unmerged.
  - No independent auditor is available.
failure_handling:
  artifact_validation_failure: Keep the branch local or Draft, publish no PASS claim, and return exact validation errors to ARC.
  external_readback_failure: Keep Cell 10 nonterminal and retry only the bounded GitHub readback or AUN delivery operation.
  protected_boundary_pressure: Stop with a blocking next_action to protected_surface_gate; do not widen this handoff.
