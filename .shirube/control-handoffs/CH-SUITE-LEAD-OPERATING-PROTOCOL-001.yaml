    - cli/**
    - adapters/**
    - core/**
    - db/**
    - migrations/**
    - package.json
    - package-lock.json
    - bun.lockb
    - pnpm-lock.yaml
    - yarn.lock
    - .env*
    - secrets/**
    - deploy/**
    - deployment/**
    - scripts/**
    - src/**
    - app/**
    - api/**
    - lib/**
