    - merge
    - draft removal
    - queue or DB mutation
    - launchd or launchctl mutation
    - secret or deployment mutation
    - required-check activation
    - branch protection or ruleset mutation
    - runtime activation
acceptance_criteria:
  - AGENTS.md and CLAUDE.md reference iyasaka-arc#27 as the suite-lead protocol baseline.
  - config/agent-role-routing.json pins operatingProtocolRef and operatingProtocolCell for suite_lead / D7 binding.
  - docs/operations/suite-lead-operating-protocol.md mirrors the #27 protocol without replacing #27 as SSOT.
  - tests/spec-enforcement/agent-role-routing-map.test.ts verifies the protocol reference and cell pin.
  - Rapid/Lite route selection maps SUITE-LEAD-OPERATING-PROTOCOL-001 to this dedicated handoff/checklist/evidence only.
  - No runtime, queue, DB, launchd, secret, deployment, required-check, branch-protection, ruleset, production, audit/QA/check/CTO, owner, or merge action is performed.
validation:
  required_commands:
    - git diff --check
    - YAML parse for .shirube/**/*.yaml
    - node --check scripts/shirube-current-overlay-check.mjs
    - bun test tests/spec-enforcement/agent-role-routing-map.test.ts
  required_evidence:
    - PR_head_SHA
    - changed_files
    - validation_commands
    - validation_results
    - audit_checklist_report
owner_decision:
  required_before_merge: true
  evidence_source: external_owner_decision_comment_or_workflow_input
  committed_pending_policy_only: true
  allowed_verdicts:
    - APPROVED_EXACT_HEAD
    - CHANGES_REQUIRED
    - BLOCKED
  exact_head_sha: null
  decision_ref: null
post_merge:
  required_when_done_claimed: true
  required_evidence:
    - merge_commit
    - merged_at
    - post_merge_smoke_or_NA
    - next_step
    - no_unresolved_follow_up_blocker
