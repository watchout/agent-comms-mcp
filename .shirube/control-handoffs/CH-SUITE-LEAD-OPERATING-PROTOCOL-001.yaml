    declared:
      - active workflows
      - agent runtime startup policy
    touched: true
    details:
      - AGENTS.md and CLAUDE.md startup/session instructions are updated.
      - The report-only Rapid/Lite workflow route table is updated to select this Cell's handoff/checklist/evidence.
      - No workflow required-check activation, branch protection, ruleset, runtime, DB, queue, launchd, secret, deploy, or production mutation is included.
  stop_conditions:
    - any product runtime, API, DB, queue worker, launchd, secret, deploy, branch protection, ruleset, or required-check activation is needed
