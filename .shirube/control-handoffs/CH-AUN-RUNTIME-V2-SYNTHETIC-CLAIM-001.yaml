acceptance_criteria:
  - Claim requires baton_id, owner_agent_id, runtime_instance_id, lease_expires_at, and fencing_token.
  - Duplicate active claim is blocked.
  - Expired claim replacement requires explicit policy.
  - Observer agent cannot claim as owner.
  - Stale holder cannot finalize.
  - Wrong fencing_token cannot finalize.
  - Synthetic mutations are limited to in-memory fixture state and production_mutations remains empty.
  - Existing runtime-v2 live claim/execute mutation path remains unchanged.
