acceptance_criteria:
  - Runtime login credential eligibility and delivery credential eligibility are exposed as separate diagnostic policy.
  - Runtime login may include registered credential evidence without forcing delivery contract drift.
  - Delivery eligibility remains active delivery credential evidence only.
  - A selected delivery path with active delivery credential evidence reports runtime_delivery_status_contract aligned.
  - A selected delivery path with active delivery credential evidence does not emit CREDENTIAL_STATUS_CONTRACT_DRIFT in the scoped read-only gate pack.
  - A selected delivery path without active delivery credential evidence still reports drift or violated contract evidence.
  - Diagnostic execution remains read-only and reports no mutation.
  - CP80-GAP-002, CP80-GAP-003, and CP80-GAP-004 remain out of scope and may keep the overall CP80 approval pack NO_GO.
