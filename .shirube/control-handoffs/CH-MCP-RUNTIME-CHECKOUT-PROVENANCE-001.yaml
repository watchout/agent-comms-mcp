acceptance_criteria:
  - Actual Git HEAD of the selected checkout is authoritative; a validated full-SHA environment fallback is used only outside a Git checkout.
  - Row and metadata path, commit, and dirty projections derive from one frozen evidence object.
  - Any contradictory path or commit projection produces runtime_checkout_evidence_mismatch without policy activation.
  - Dirty allowances and drift exclusions cannot suppress an evidence-integrity mismatch.
  - Runtime inventory, connector inventory, and fleet readiness preserve the mismatch as a blocker.
  - Aligned clean, dirty, allowed-dirty, and legacy evidence remain compatible.
  - Focused tests run with DATABASE_URL and AGENT_COM_DB explicitly unset.
  - No runtime, persistent database, provider, queue, daemon, protected setting, approval, Ready, merge, or release effect occurs.
validation:
  required_commands:
    - git diff --check origin/main...HEAD
    - env -u DATABASE_URL -u AGENT_COM_DB bun test tests/git-checkout-evidence.test.ts tests/fleet-checkout-drift.test.ts tests/runtime-inventory.test.ts tests/aun-fleet-readiness.test.ts tests/spec-enforcement/cli-commands.test.ts
    - env -u DATABASE_URL -u AGENT_COM_DB bun build server.ts --target=bun --outdir=/tmp/agent-comms-runtime-provenance-build
    - YAML parse with aliases disabled
    - Cell allowed-path replay
  required_evidence:
    - PR_head_SHA
    - changed_files
    - diff_scope_report
    - focused_DB_isolated_test_result
    - DB_free_server_build_result
    - YAML_parse_result
    - structured_audit_comment
    - authenticated_external_gate_subject_artifact
