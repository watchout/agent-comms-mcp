name: PR Checks (Layer 0)

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent_comms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agent_comms_test
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so `scripts/detect-breaking-changes.sh` can
          # `git diff BASE...HEAD`. With the default shallow checkout
          # the base ref is unreachable and the script bails with
          # `fatal: ambiguous argument 'main..HEAD'`.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run migrations (idempotent, safe to re-run)
        run: bun run db/migrate.ts
      - name: Type check
        run: bunx tsc --noEmit --allowImportingTsExtensions --skipLibCheck || true
      - name: Breaking-change detection (Layer 0 gate)
        # Scans for 7 breaking-change patterns (deleted fallbacks,
        # signature changes, removed exports, removed env vars,
        # DROP TABLE/COLUMN, API endpoint deletion, shared/global
        # resource deletion) vs origin/main. Base ref must be
        # `origin/main` because only origin/* refs are populated
        # after actions/checkout@v4.
        #
        # When the PR carries the `breaking-change-verified` label,
        # the governance flow (ai-dev-framework governance-flow.md)
        # treats the change as intentional and consumer-verified —
        # this step then logs findings for the audit trail but does
        # not block the build. Without the label, any detection is
        # a hard fail.
        if: "!contains(github.event.pull_request.labels.*.name, 'breaking-change-verified')"
        run: bash scripts/detect-breaking-changes.sh origin/main
      - name: Breaking-change detection (label-override, informational)
        if: contains(github.event.pull_request.labels.*.name, 'breaking-change-verified')
        run: |
          echo "::notice::PR has 'breaking-change-verified' label — detection is informational only."
          bash scripts/detect-breaking-changes.sh origin/main || true
      - name: Run test suite
        run: bun test
