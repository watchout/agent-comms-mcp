name: PR Checks (Layer 0 + route classification)

# Company Dev OS operating model — AUN pilot
#
# Layer 0 (machine gate, blocking):
#   - PR uptodate check (merge queue simulation)
#   - bun test full suite
#   - detect-breaking-changes.sh (7 patterns)
#   - classify-pr.sh → route label output
#
# Audit (parallel, non-blocking for yellow):
#   - Runs in parallel with Layer 0
#   - Red finding → job fails (blocks merge)
#   - Yellow finding → annotation only (async issue creation on post-merge)
#
# Route enforcement:
#   route:fast-merge   → Layer 0 green + non-draft + owner exact-head labels
#   route:ceo-approval → Layer 0 green + CTO/CEO/human maintainer handling

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
      - labeled
      - unlabeled
      - edited
  push:
    branches: [main]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  # ── Layer 0: Machine gate ────────────────────────────────────────────────
  layer0:
    name: Layer 0 — machine gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent_comms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres17:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent_comms_bounded17_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agent_comms_test
      AGENT_COM_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agent_comms_test
      AGENT_COM_BOUNDED_PG16_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agent_comms_test
      AGENT_COM_BOUNDED_PG17_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/agent_comms_bounded17_test
      AUN_BOUNDED_TEST_STAGE: ci
    outputs:
      route: ${{ steps.classify.outputs.route }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Merge queue simulation: PR must be up-to-date with main ──────────
      # Without GitHub Team plan (which has native merge queue), we enforce
      # the same invariant: no PR can merge if it's behind main.
      # This prevents "passed CI on stale base" failures.
      - name: Check PR is up-to-date with main
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main
          BEHIND=$(git rev-list --count HEAD..origin/main)
          if [ "$BEHIND" -gt 0 ]; then
            echo "::error::PR is $BEHIND commit(s) behind main."
            echo "::error::Rebase onto latest main and re-push before merging."
            echo "::error::This enforces the merge queue invariant: all merges re-verified on latest main."
            exit 1
          fi
          echo "PR is up-to-date with main ✅"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify isolated PostgreSQL versions and record tested subject
        run: |
          set -euo pipefail
          test "$(psql "$AGENT_COM_BOUNDED_PG16_TEST_DATABASE_URL" -X -At -v ON_ERROR_STOP=1 -c "SELECT current_setting('server_version_num')::int BETWEEN 160000 AND 169999 AND current_database()='agent_comms_test' AND inet_server_port()=5432")" = t
          test "$(psql "$AGENT_COM_BOUNDED_PG17_TEST_DATABASE_URL" -X -At -v ON_ERROR_STOP=1 -c "SELECT current_setting('server_version_num')::int BETWEEN 170000 AND 179999 AND current_database()='agent_comms_bounded17_test' AND inet_server_port()=5432 AND current_setting('transaction_timeout',true) IS NOT NULL")" = t
          psql "$AGENT_COM_BOUNDED_PG16_TEST_DATABASE_URL" -X -At -v ON_ERROR_STOP=1 -c "SELECT current_database(),current_user,current_setting('server_version_num'),inet_server_port()" > bounded-ci-versions.txt
          psql "$AGENT_COM_BOUNDED_PG17_TEST_DATABASE_URL" -X -At -v ON_ERROR_STOP=1 -c "SELECT current_database(),current_user,current_setting('server_version_num'),inet_server_port()" >> bounded-ci-versions.txt
          bounded_fixture_dir=$(mktemp -d "$RUNNER_TEMP/aun-bounded-ci.XXXXXX")
          chmod 700 "$bounded_fixture_dir"
          printf 'AUN_BOUNDED_FIXTURE_ROOT=%s\n' "$bounded_fixture_dir" >> "$GITHUB_ENV"
          node --input-type=module > bounded-ci-subject.json <<'JS'
          import {readFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          const git=(...a)=>execFileSync('git',a,{encoding:'utf8'}).trim();
          const sha=b=>createHash('sha256').update(b).digest('hex');
          const event=JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH,'utf8'));
          const tested_commit=git('rev-parse','HEAD'),candidate_head=event.pull_request?.head.sha??tested_commit;
          const base=event.pull_request?.base.sha??'0f772883db6f3b50772d3e4b82ce47795091f0a9';
          const test_files_sha256=Object.fromEntries(['admission','admission_postgres','retry','use_trace'].map(n=>{
            const p=`tests/contract/test_queue_bounded_${n}.test.ts`;return[p,sha(readFileSync(p))];
          }));
          console.log(JSON.stringify({base,candidate_head,candidate_tree:git('rev-parse',`${candidate_head}^{tree}`),tested_commit,
            tested_tree:git('rev-parse','HEAD^{tree}'),tested_parents:git('rev-list','--parents','-n1','HEAD').split(' ').slice(1),
            binary_diff_sha256:sha(execFileSync('git',['diff','--binary',`${base}...${candidate_head}`])),test_files_sha256,
            design_raw_sha256:'ed86b14f35b97d8483bf8052dd73765732c4568a945cb6e59bc6b8b7e99ea703',
            design_canonical_sha256:'880b99e5514f9791968ba8971e9d526b59173732986c12a54e8db04413f1972e',
            run_id:process.env.GITHUB_RUN_ID,run_attempt:process.env.GITHUB_RUN_ATTEMPT,scope:'TESTED_CHECKOUT_OBSERVATION',private_status:'PRIVATE_STAGE_REQUIRED'}));
          JS

      - name: Run migrations
        run: bun run db/migrate.ts

      - name: Run bounded PostgreSQL 17 migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/agent_comms_bounded17_test
          AGENT_COM_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/agent_comms_bounded17_test
        run: bun run db/migrate.ts

      - name: Type check
        run: bunx tsc --noEmit --allowImportingTsExtensions --skipLibCheck || true

      - name: Breaking-change detection
        if: "!contains(github.event.pull_request.labels.*.name, 'breaking-change-verified')"
        run: bash scripts/detect-breaking-changes.sh origin/main

      - name: Breaking-change detection (label-override, informational)
        if: contains(github.event.pull_request.labels.*.name, 'breaking-change-verified')
        run: |
          echo "::notice::PR has 'breaking-change-verified' label — detection informational."
          bash scripts/detect-breaking-changes.sh origin/main || true

      - name: PR route classification
        id: classify
        if: github.event_name == 'pull_request'
        run: |
          bash scripts/classify-pr.sh origin/main --json > route.json || true
          cat route.json
          ROUTE=$(jq -r '.route' route.json 2>/dev/null || echo "fast-merge")
          echo "route=$ROUTE" >> "$GITHUB_OUTPUT"
          if [ "$ROUTE" = "ceo-approval" ]; then
            echo "::warning::route:ceo-approval detected — this PR requires CEO approval before merge."
            echo "::warning::$(jq -r '.reasons | join(", ")' route.json)"
          else
            echo "::notice::route:fast-merge — CI green still requires Shirube/owner exact-head controls before merge."
          fi

      - name: Shirube current-overlay gate
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git diff --name-only origin/main...HEAD > changed-files.txt
          node scripts/shirube-current-overlay-check.mjs \
            --repo "${{ github.repository }}" \
            --event "$GITHUB_EVENT_PATH" \
            --changed-files changed-files.txt

      - name: Run full test suite
        run: bun test --timeout 30000 --reporter=junit --reporter-outfile=bounded-full.xml

      - name: Verify bounded public stage (private stage remains required)
        run: |
          python3 - ci bounded-full.xml > bounded-ci-stage.json <<'PY'
          import hashlib, json, sys, xml.etree.ElementTree as ET
          route, file = sys.argv[1:]
          assert route in ("ci", "local17", "private"), "route_invalid"
          private = ["BA-CORE-F08", "BA-CORE-F10"]
          core = [f"BA-CORE-F{i:02}" for i in range(1, 12) if i not in (8, 10)]
          pg17 = [f"BA-17-F{n}-{x}" for n in (12, 13) for x in "ABC"]
          pg16 = ["BA-16-MIGRATION", "BA-16-UNSUPPORTED", "BA-16-DEFAULT-CLAIM", "BA-16-DEFAULT-RETRY"]
          required = private if route == "private" else core + pg17 + (pg16 if route == "ci" else [])
          raw = open(file, "rb").read()
          cases = list(ET.fromstring(raw).iter("testcase"))
          for name in required:
              matching = [c for c in cases if c.get("name") == name]
              assert len(matching) == 1, (name, "missing_or_duplicate")
              assert not any(x.tag in ("failure", "error", "skipped") for x in matching[0]), (name, "not_executed_pass")
          assert not any(x.tag in ("failure", "error") for c in cases for x in c), "global_failure"
          observed = [c.get("name") for c in cases if c.get("name", "").startswith("BA-")]
          assert set(observed) == set(required) and len(observed) == len(required), "stage_identity_partition"
          print(json.dumps({"route":route,"required_ids":required,"executed_pass":len(required),"required_failed_or_skipped":0,"junit_sha256":hashlib.sha256(raw).hexdigest(),"other_skipped":sum(any(x.tag=="skipped" for x in c) for c in cases),"scope":"STAGE_PROCEDURE_ONLY","private_status":"VERIFIED_IN_SEPARATE_STAGE" if route=="private" else "PRIVATE_STAGE_REQUIRED"}))
          PY

      - name: Upload route classification
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: route-${{ github.event.pull_request.number }}
          path: |
            route.json
            bounded-full.xml
            bounded-ci-stage.json
            bounded-ci-subject.json
            bounded-ci-versions.txt
          retention-days: 7

  # ── Auto-merge (owner exact-head + explicit method gated) ────────────────
  # route:fast-merge + all Layer 0 checks pass is not sufficient.
  # The PR must be non-draft, carry owner exact-head current-overlay labels,
  # and have merge-method:squash matching the exact-head owner decision.
  # merge-method:merge and merge-method:rebase remain human-executed methods.
  # route:ceo-approval PRs are skipped here for human maintainer handling.
  auto-merge:
    name: Auto-merge (explicit owner-selected squash)
    runs-on: ubuntu-latest
    needs: [layer0]
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      contains(github.event.pull_request.labels.*.name, 'owner-exact-head-approved') &&
      contains(github.event.pull_request.labels.*.name, 'shirube-current-overlay') &&
      contains(github.event.pull_request.labels.*.name, 'merge-method:squash') &&
      needs.layer0.result == 'success' &&
      needs.layer0.outputs.route != 'ceo-approval'
    permissions:
      contents: write
      pull-requests: write
    steps:
      # gh pr merge requires a git repository context — without checkout the
      # job fails with "not a git repository" (observed on PR #736).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Revalidate live authority and squash checked head
        run: |
          set -euo pipefail
          PR_NUMBER="${{ github.event.pull_request.number }}"
          CHECKED_HEAD="${{ github.event.pull_request.head.sha }}"

          gh pr view "$PR_NUMBER" \
            --json number,isDraft,body,labels,headRefOid \
            --jq '{number, pull_request: {number: .number, draft: .isDraft, body: .body, labels: .labels, head: {sha: .headRefOid}}}' \
            > live-pr-event.json
          gh api --paginate "repos/${{ github.repository }}/issues/$PR_NUMBER/comments?per_page=100" \
            --jq '.[]' | jq -s '.' > live-owner-comments.json
          git diff --name-only origin/main...HEAD > live-changed-files.txt

          node scripts/shirube-current-overlay-check.mjs \
            --repo "${{ github.repository }}" \
            --event live-pr-event.json \
            --comments live-owner-comments.json \
            --changed-files live-changed-files.txt \
            --expected-head "$CHECKED_HEAD" \
            --required-merge-method squash

          PR_TITLE="$(gh pr view "$PR_NUMBER" --json title --jq .title)"
          MERGE_RESULT="$(gh api --method PUT \
            "repos/${{ github.repository }}/pulls/$PR_NUMBER/merge" \
            -f sha="$CHECKED_HEAD" \
            -f merge_method=squash \
            -f commit_title="$PR_TITLE")"
          echo "$MERGE_RESULT" | jq .
          test "$(echo "$MERGE_RESULT" | jq -r .merged)" = "true"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Audit (parallel with Layer 0, async signal) ──────────────────────────
  # audit bot runs in parallel — does NOT block merge for yellow findings.
  # Red findings (hard gate items) fail this job and block the PR.
  audit:
    name: Audit signal (async)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scope check — 1 PR 1 concern
        id: scope
        run: |
          CHANGED_COUNT=$(git diff --name-only origin/main...HEAD | wc -l)
          echo "changed_files=$CHANGED_COUNT" >> "$GITHUB_OUTPUT"
          if [ "$CHANGED_COUNT" -gt 40 ]; then
            echo "::warning::PR touches $CHANGED_COUNT files — consider splitting into smaller slices."
          fi

      - name: SSOT drift check
        run: |
          # Detect changes to docs/SSOT.md without corresponding implementation
          # or implementation without SSOT update (yellow finding, not blocking)
          if git diff --name-only origin/main...HEAD | grep -q 'docs/SSOT.md'; then
            echo "::notice::SSOT.md updated — verify implementation is aligned."
          fi
          if git diff --name-only origin/main...HEAD | grep -qE '(core/|adapters/).*\.(ts)$'; then
            if ! git diff --name-only origin/main...HEAD | grep -q 'docs/SSOT.md'; then
              echo "::notice::Implementation changed without SSOT update — verify spec alignment (yellow finding)."
            fi
          fi

      - name: "Hard gate: no test-skip patterns"
        run: |
          if git diff origin/main...HEAD | grep -qE '^\+.*(\.skip\(|\.only\(|it\.skip|describe\.skip)'; then
            echo "::error::HARD GATE: test skip patterns detected in diff. Remove before merge."
            exit 1
          fi
          echo "No test-skip patterns ✅"

      - name: "Hard gate: no console.log in production code"
        run: |
          CONSOLE_HITS=$(git diff origin/main...HEAD -- \
            '*.ts' ':!*.test.ts' ':!tests/' \
            | grep -E '^\+[^+].*console\.(log|warn|error|debug)\(' || true)
          if [ -n "$CONSOLE_HITS" ]; then
            echo "::warning::console.log in production code detected — use core/logger.ts instead."
            echo "$CONSOLE_HITS"
          fi

      - name: "Hard gate: no process.stderr.write in new code"
        run: |
          NEW_STDERR=$(git diff origin/main...HEAD -- \
            'core/*.ts' 'adapters/*.ts' ':!*.test.ts' \
            | grep -E '^\+[^+].*process\.stderr\.write' || true)
          if [ -n "$NEW_STDERR" ]; then
            echo "::warning::New process.stderr.write in core/adapters — use core/logger.ts instead."
            echo "$NEW_STDERR"
          fi
