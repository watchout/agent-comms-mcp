name: PR Checks (Layer 0)

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent_comms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agent_comms_test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run migrations (idempotent, safe to re-run)
        run: bun run db/migrate.ts
      - name: Type check
        run: bunx tsc --noEmit --allowImportingTsExtensions --skipLibCheck || true
      - name: Breaking-change detection (Layer 0 gate)
        # Fails the build when any of the 7 breaking-change patterns
        # (deleted fallbacks, signature changes, removed exports,
        # removed env vars, DROP TABLE/COLUMN, API endpoint deletion,
        # shared/global resource deletion) are detected without a
        # `breaking-change-verified` PR label. Non-PR pushes (e.g.
        # direct pushes to main) skip the label requirement so the
        # build does not hard-fail on legitimate merges.
        run: bash scripts/detect-breaking-changes.sh
      - name: Run test suite
        run: bun test
