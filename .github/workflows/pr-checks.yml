name: PR Checks (Layer 0)

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent_comms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agent_comms_test
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so `scripts/detect-breaking-changes.sh` can
          # `git diff BASE...HEAD`. With the default shallow checkout
          # the base ref is unreachable and the script bails with
          # `fatal: ambiguous argument 'main..HEAD'`.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run migrations (idempotent, safe to re-run)
        run: bun run db/migrate.ts
      - name: Type check
        run: bunx tsc --noEmit --allowImportingTsExtensions --skipLibCheck || true
      - name: Breaking-change detection (Layer 0 gate)
        # Fails the build when any of the 7 breaking-change patterns
        # (deleted fallbacks, signature changes, removed exports,
        # removed env vars, DROP TABLE/COLUMN, API endpoint deletion,
        # shared/global resource deletion) are detected. Base ref is
        # `origin/main` because the script does `git diff BASE...HEAD`
        # and only origin/* refs are populated after the checkout
        # action. For PRs the pull_request.base.sha would also work;
        # origin/main is the simpler anchor.
        run: bash scripts/detect-breaking-changes.sh origin/main
      - name: Run test suite
        run: bun test
