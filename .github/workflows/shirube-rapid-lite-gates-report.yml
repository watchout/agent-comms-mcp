name: Shirube Rapid/Lite Gates Report

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited
      - labeled
      - unlabeled

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  collect-shirube-pr-inputs:
    name: Collect Shirube PR inputs
    runs-on: ubuntu-latest
    outputs:
      structured_audit_comment_ref: ${{ steps.refs.outputs.structured_audit_comment_ref }}
      additional_review_ref: ${{ steps.refs.outputs.additional_review_ref }}
      additional_review_comment_ref: ${{ steps.refs.outputs.additional_review_comment_ref }}
      handoff_ref: ${{ steps.refs.outputs.handoff_ref }}
      audit_checklist_ref: ${{ steps.refs.outputs.audit_checklist_ref }}
      audit_machine_evidence_ref: ${{ steps.refs.outputs.audit_machine_evidence_ref }}
      route_cell_id: ${{ steps.refs.outputs.route_cell_id }}
    steps:
      - name: Extract comment-backed audit ref
        id: refs
        run: |
          node <<'NODE'
          const fs = require("fs");
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, "utf8"));
          const body = event.pull_request?.body || "";
          function refFromBody(keys) {
            for (const key of keys) {
              const escaped = key.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
              const pattern = new RegExp(`(?:^|\\n)\\s*(?:[-*]\\s*)?(?:${escaped})\\s*:\\s*([^\\n]+?)\\s*(?=\\n|$)`, "i");
              const value = body.match(pattern)?.[1]?.trim().replace(/^["'`]|["'`]$/g, "");
              if (value && value !== "null") return value.split(/\s+/)[0];
            }
            return "";
          }
          function supportedCommentRef(value) {
            return (
            /^https:\/\/github\.com\/[^/]+\/[^/]+\/(?:pull|issues)\/\d+#issuecomment-\d+$/.test(value) ||
            /^https:\/\/github\.com\/[^/]+\/[^/]+\/issues\/comments\/\d+$/.test(value) ||
            /^github-comment:\/\/[^/]+\/[^/]+\/(?:pull|issues)\/\d+#issuecomment-\d+$/.test(value) ||
            /^github-comment:\/\/[^/]+\/[^/]+\/issues\/comments\/\d+$/.test(value)
            );
          }
          function supportedCommentRefList(value) {
            if (!value) return false;
            return value.split(",").map((entry) => entry.trim()).every(supportedCommentRef);
          }
          function localRef(value) {
            if (!value || /^https?:\/\//i.test(value) || /^github-comment:\/\//i.test(value)) return "";
            return value;
          }
          const structuredAuditCommentRef = refFromBody(["structured_audit_comment_ref", "structured_audit_comment", "structured-audit-comment"]);
          const additionalReviewRef = refFromBody(["additional_review_ref", "additional_review", "additional-review", "protected_review_ref", "protected_review"]);
          const additionalReviewCommentRef = refFromBody(["additional_review_comment_ref", "additional_review_comment", "additional-review-comment", "protected_review_comment_ref", "protected_review_comment"]);
          const primaryCellId = body.match(/(?:^|\n)\s*CELL-ID\s*:\s*([^\s`'"]+)/i)?.[1]?.trim() || "";
          const implementationRoutes = [
            {
              cellId: "CELL-MCP-SHIRUBE-RAPID-LITE-PILOT-001",
              handoffRef: ".shirube/control-handoffs/CH-001.yaml",
              auditChecklistRef: ".shirube/audit-checklists/AUDIT-CHECKLIST-CELL-MCP-SHIRUBE-RAPID-LITE-PILOT-001.yaml",
              auditMachineEvidenceRef: ".shirube/evidence/EVIDENCE-CELL-MCP-SHIRUBE-RAPID-LITE-PILOT-001.yaml",
            },
            {
              cellId: "CELL-MCP-AUN-K0-CONTRACT-CORPUS-BENCHMARK-001",
              handoffRef: ".shirube/control-handoffs/CH-AUN-FIRST-F1-K0-CONTRACT-CORPUS-BENCHMARK-001.yaml",
              auditChecklistRef: ".shirube/audit-checklists/AUDIT-CHECKLIST-CELL-MCP-AUN-K0-CONTRACT-CORPUS-BENCHMARK-001.yaml",
              auditMachineEvidenceRef: ".shirube/evidence/EVIDENCE-CELL-MCP-AUN-K0-CONTRACT-CORPUS-BENCHMARK-001.yaml",
            },
            {
              cellId: "CELL-MCP-AUN-RUNTIME-V2-CLAIM-DRYRUN-001",
              handoffRef: ".shirube/control-handoffs/CH-AUN-RUNTIME-V2-CLAIM-DRYRUN-001.yaml",
              auditChecklistRef: ".shirube/audit-checklists/AUDIT-CHECKLIST-CELL-MCP-AUN-RUNTIME-V2-CLAIM-DRYRUN-001.yaml",
              auditMachineEvidenceRef: ".shirube/evidence/EVIDENCE-CELL-MCP-AUN-RUNTIME-V2-CLAIM-DRYRUN-001.yaml",
            },
            {
              cellId: "CELL-MCP-AUN-RUNTIME-V2-SYNTHETIC-CLAIM-001",
              handoffRef: ".shirube/control-handoffs/CH-AUN-RUNTIME-V2-SYNTHETIC-CLAIM-001.yaml",
              auditChecklistRef: ".shirube/audit-checklists/AUDIT-CHECKLIST-CELL-MCP-AUN-RUNTIME-V2-SYNTHETIC-CLAIM-001.yaml",
              auditMachineEvidenceRef: ".shirube/evidence/EVIDENCE-CELL-MCP-AUN-RUNTIME-V2-SYNTHETIC-CLAIM-001.yaml",
            },
            {
              cellId: "CELL-MCP-AUN-RUNTIME-V2-LIVE-KODAMA-CANARY-001",
              handoffRef: ".shirube/control-handoffs/CH-AUN-RUNTIME-V2-LIVE-KODAMA-CANARY-001.yaml",
              auditChecklistRef: ".shirube/audit-checklists/AUDIT-CHECKLIST-CELL-MCP-AUN-RUNTIME-V2-LIVE-KODAMA-CANARY-001.yaml",
              auditMachineEvidenceRef: ".shirube/evidence/EVIDENCE-CELL-MCP-AUN-RUNTIME-V2-LIVE-KODAMA-CANARY-001.yaml",
            },
            {
              cellId: "CELL-MCP-AUN-RUNTIME-V2-MEDIATED-FINALIZATION-001",
              handoffRef: ".shirube/control-handoffs/CH-AUN-RUNTIME-V2-MEDIATED-FINALIZATION-001.yaml",
              auditChecklistRef: ".shirube/audit-checklists/AUDIT-CHECKLIST-CELL-MCP-AUN-RUNTIME-V2-MEDIATED-FINALIZATION-001.yaml",
              auditMachineEvidenceRef: ".shirube/evidence/EVIDENCE-CELL-MCP-AUN-RUNTIME-V2-MEDIATED-FINALIZATION-001.yaml",
            },
            {
              cellId: "CELL-MCP-AUN-RUNTIME-V2-POLICY-ALLOWLIST-001",
              handoffRef: ".shirube/control-handoffs/CH-AUN-RUNTIME-V2-POLICY-ALLOWLIST-001.yaml",
              auditChecklistRef: ".shirube/audit-checklists/AUDIT-CHECKLIST-CELL-MCP-AUN-RUNTIME-V2-POLICY-ALLOWLIST-001.yaml",
              auditMachineEvidenceRef: ".shirube/evidence/EVIDENCE-CELL-MCP-AUN-RUNTIME-V2-POLICY-ALLOWLIST-001.yaml",
            },
            {
              cellId: "CELL-MCP-AUN-CP80-PROJECTION-CREDENTIAL-CONTRACT-DIAGNOSTIC-001",
              handoffRef: ".shirube/control-handoffs/CH-AUN-CP80-PROJECTION-CREDENTIAL-CONTRACT-DIAGNOSTIC-001.yaml",
              auditChecklistRef: ".shirube/audit-checklists/AUDIT-CHECKLIST-CELL-MCP-AUN-CP80-PROJECTION-CREDENTIAL-CONTRACT-DIAGNOSTIC-001.yaml",
              auditMachineEvidenceRef: ".shirube/evidence/EVIDENCE-CELL-MCP-AUN-CP80-PROJECTION-CREDENTIAL-CONTRACT-DIAGNOSTIC-001.yaml",
            },
            {
              cellId: "CELL-MCP-AUN-CONNECTOR-CREDENTIAL-DIAGNOSTIC-001",
              handoffRef: ".shirube/control-handoffs/CH-AUN-CONNECTOR-CREDENTIAL-DIAGNOSTIC-001.yaml",
              auditChecklistRef: ".shirube/audit-checklists/AUDIT-CHECKLIST-CELL-MCP-AUN-CONNECTOR-CREDENTIAL-DIAGNOSTIC-001.yaml",
              auditMachineEvidenceRef: ".shirube/evidence/EVIDENCE-CELL-MCP-AUN-CONNECTOR-CREDENTIAL-DIAGNOSTIC-001.yaml",
            },
            {
              cellId: "CELL-MCP-AUN-CONNECTOR-PROVIDER-IDENTITY-VERIFY-001",
              handoffRef: ".shirube/control-handoffs/CH-AUN-CONNECTOR-PROVIDER-IDENTITY-VERIFY-001.yaml",
              auditChecklistRef: ".shirube/audit-checklists/AUDIT-CHECKLIST-CELL-MCP-AUN-CONNECTOR-PROVIDER-IDENTITY-VERIFY-001.yaml",
              auditMachineEvidenceRef: ".shirube/evidence/EVIDENCE-CELL-MCP-AUN-CONNECTOR-PROVIDER-IDENTITY-VERIFY-001.yaml",
            },
            {
              cellId: "CELL-MCP-AUN-CONNECTOR-CHANNEL-ACCESS-DISCOVERY-001",
              handoffRef: ".shirube/control-handoffs/CH-AUN-CONNECTOR-CHANNEL-ACCESS-DISCOVERY-001.yaml",
              auditChecklistRef: ".shirube/audit-checklists/AUDIT-CHECKLIST-CELL-MCP-AUN-CONNECTOR-CHANNEL-ACCESS-DISCOVERY-001.yaml",
              auditMachineEvidenceRef: ".shirube/evidence/EVIDENCE-CELL-MCP-AUN-CONNECTOR-CHANNEL-ACCESS-DISCOVERY-001.yaml",
            },
            {
              cellId: "CELL-MCP-AUN-CONNECTOR-UI-BINDINGS-MATERIALIZER-001",
              handoffRef: ".shirube/control-handoffs/CH-AUN-CONNECTOR-UI-BINDINGS-MATERIALIZER-001.yaml",
              auditChecklistRef: ".shirube/audit-checklists/AUDIT-CHECKLIST-CELL-MCP-AUN-CONNECTOR-UI-BINDINGS-MATERIALIZER-001.yaml",
              auditMachineEvidenceRef: ".shirube/evidence/EVIDENCE-CELL-MCP-AUN-CONNECTOR-UI-BINDINGS-MATERIALIZER-001.yaml",
            },
            {
              cellId: "SUITE-LEAD-OPERATING-PROTOCOL-001",
              handoffRef: ".shirube/control-handoffs/CH-SUITE-LEAD-OPERATING-PROTOCOL-001.yaml",
              auditChecklistRef: ".shirube/audit-checklists/AUDIT-CHECKLIST-SUITE-LEAD-OPERATING-PROTOCOL-001.yaml",
              auditMachineEvidenceRef: ".shirube/evidence/EVIDENCE-SUITE-LEAD-OPERATING-PROTOCOL-001.yaml",
            },
            {
              cellId: "CELL-MCP-AUN-V2-CUTOVER-M3-001",
              handoffRef: ".shirube/control-handoffs/CH-AUN-V2-CUTOVER-M3-001.yaml",
              auditChecklistRef: ".shirube/audit-checklists/AUDIT-CHECKLIST-CELL-MCP-AUN-V2-CUTOVER-M3-001.yaml",
              auditMachineEvidenceRef: ".shirube/evidence/EVIDENCE-CELL-MCP-AUN-V2-CUTOVER-M3-001.yaml",
            },
            {
              cellId: "CELL-MCP-AUN-CP80-FLEET-MODE-001",
              handoffRef: ".shirube/control-handoffs/CH-AUN-CP80-FLEET-MODE-001.yaml",
              auditChecklistRef: ".shirube/audit-checklists/AUDIT-CHECKLIST-CELL-MCP-AUN-CP80-FLEET-MODE-001.yaml",
              auditMachineEvidenceRef: ".shirube/evidence/EVIDENCE-CELL-MCP-AUN-CP80-FLEET-MODE-001.yaml",
            },
          ];
          const route = implementationRoutes.find((candidate) => primaryCellId === candidate.cellId);
          if (!route) {
            console.error(`ROUTE_NOT_REGISTERED: CELL-ID=${primaryCellId || "<missing>"}`);
            process.exit(1);
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `structured_audit_comment_ref=${supportedCommentRef(structuredAuditCommentRef) ? structuredAuditCommentRef : ""}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `additional_review_ref=${localRef(additionalReviewRef)}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `additional_review_comment_ref=${supportedCommentRefList(additionalReviewCommentRef) ? additionalReviewCommentRef : ""}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `handoff_ref=${route.handoffRef}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `audit_checklist_ref=${route.auditChecklistRef}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `audit_machine_evidence_ref=${route.auditMachineEvidenceRef}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `route_cell_id=${route.cellId}\n`);
          NODE

  shirube-rapid-lite-gates-report:
    name: Shirube Rapid/Lite Gates Report
    needs: collect-shirube-pr-inputs
    uses: "watchout/ai-dev-framework/.github/workflows/shirube-rapid-lite-reusable.yml@3b70d368bcbbcb1d200a941a8a0130aa54edf722"
    permissions:
      contents: read
      pull-requests: write
      issues: write
    with:
      framework_ref: "watchout/ai-dev-framework@3b70d368bcbbcb1d200a941a8a0130aa54edf722"
      profile: hotel-lite
      report_only: true
      pr_body: "${{ github.event.pull_request.body || '' }}"
      changed_files: ""
      execution_context_ref: .shirube/execution-context.yaml
      adoption_plan_ref: .shirube/adoption-intake.yaml
      lifecycle_state_ref: .shirube/lifecycle-state.yaml
      handoff_ref: ${{ needs.collect-shirube-pr-inputs.outputs.handoff_ref }}
      validation_evidence_ref: ""
      owner_decision_ref: ""
      enforcement_policy_ref: .shirube/enforcement-policy.yaml
      audit_checklist_ref: ${{ needs.collect-shirube-pr-inputs.outputs.audit_checklist_ref }}
      structured_audit_ref: ""
      structured_audit_comment_ref: ${{ needs.collect-shirube-pr-inputs.outputs.structured_audit_comment_ref }}
      additional_review_ref: ${{ needs.collect-shirube-pr-inputs.outputs.additional_review_ref }}
      additional_review_comment_ref: ${{ needs.collect-shirube-pr-inputs.outputs.additional_review_comment_ref }}
      audit_machine_evidence_ref: ${{ needs.collect-shirube-pr-inputs.outputs.audit_machine_evidence_ref }}
